<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History by liho | 8 класс</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f1ea;--text:#2c3e50;--primary:#2980b9;--card:#fff;--border:#e0dcd3;--gb:#e8f8f5;--gbr:#1abc9c;--gt:#117864;--red:#e74c3c;--gold:#f1c40f}
body.theme-dark{--bg:#121212;--text:#e0e0e0;--card:#1e1e1e;--border:#333;--primary:#3498db}
body.theme-parchment{--bg:#f4e4bc;--text:#3e2723;--card:#fdf5e6;--border:#d7ccc8;--primary:#8d6e63}
body.theme-archive{--bg:#2b2b2b;--text:#d4d4d4;--card:#383838;--border:#555;--primary:#e67e22}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:20px 10px}
.container{max-width:900px;margin:0 auto;position:relative}
#peso-balance{position:absolute;top:-10px;left:0;background:var(--card);padding:5px 15px;border-radius:20px;border:2px solid var(--gold);font-weight:700;font-size:15px;z-index:100;display:flex;align-items:center;gap:15px}
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding-top:40px}
.main-title{font-family:'Merriweather',serif;font-size:52px;font-weight:900;background:linear-gradient(45deg,#1e3a5f,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:40px}
.books{display:flex;gap:20px;width:100%;max-width:800px;justify-content:center}
.book{flex:1;background:var(--card);border:2px solid var(--border);border-radius:16px;padding:20px 15px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center}
.book:hover{transform:translateY(-5px);border-color:var(--primary)}
.book-cover{width:100%;max-width:220px;height:300px;object-fit:cover;border-radius:8px;margin-bottom:15px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.bt{font-family:'Merriweather',serif;font-size:20px;font-weight:700;margin-bottom:8px}
.bd{font-size:13px;color:#7f8c8d}
@media(max-width:600px){.main-title{font-size:32px}.books{gap:10px}.book{padding:15px 8px}.bt{font-size:14px}.bd{font-size:10px}.book-cover{height:200px;font-size:48px}}
#book-screen{display:none;padding-top:40px}
.header{text-align:center;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-family:'Merriweather',serif;font-size:22px;font-weight:700}
.btn-nav{background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:8px;font-weight:500;cursor:pointer;color:var(--text);font-size:14px}
.tabs{display:flex;margin-bottom:20px;border-bottom:2px solid var(--border);overflow-x:auto}
.tab{flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;background:none;border:none;color:#7f8c8d;border-bottom:3px solid transparent;font-size:15px;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.cb{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:20px}
.cn{font-family:'Merriweather',serif;font-size:16px;font-weight:700;margin-bottom:15px}
.cn::before{content:'📖 '}
.bg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px}
@media(max-width:400px){.bg{grid-template-columns:repeat(4,1fr)}}
.bp{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 5px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;color:var(--text)}
.bp:hover{background:var(--card);border-color:var(--primary);color:var(--primary)}
.bc{width:100%;background:linear-gradient(135deg,var(--primary),#3498db);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
.para-header{font-family:'Merriweather',serif;font-size:16px;font-weight:700;margin:20px 0 8px 0;border-bottom:1px solid var(--border);padding-bottom:5px}
.pa{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:var(--card)}
.pa summary{background:var(--bg);padding:12px 18px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.pa summary::after{content:'▼';font-size:10px;color:#7f8c8d}
.qi{padding:15px}
.qa{margin-bottom:12px;border-bottom:1px dashed var(--border);padding-bottom:12px}
.qa summary{padding:6px 0;font-size:14px;font-weight:500;cursor:pointer;list-style:none;display:flex;gap:10px;line-height:1.4}
.qa summary::before{content:'?';display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--border);border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
.at{margin-top:8px;margin-left:30px;padding:14px;background:var(--gb);border-left:3px solid var(--gbr);border-radius:0 8px 8px 0;color:var(--gt);font-size:14px}
#test{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.th{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid var(--border)}
@media(min-width:600px){.th{flex-direction:row;justify-content:space-between;align-items:center}}
.tt{font-family:'Merriweather',serif;font-size:18px;font-weight:700}
.qc{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:15px;position:relative}
.qt{font-size:15px;font-weight:600;margin-bottom:12px;padding-right:42px}
.ol{display:flex;flex-direction:column;gap:8px}
.ob{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:left;font-size:14px;cursor:pointer;color:var(--text)}
.ob:hover{background:var(--bg)}
.ob.correct{background:var(--gb);border-color:var(--gbr);color:var(--gt);font-weight:600}
.ob.wrong{background:#fdedec;border-color:var(--red);color:#922b21;text-decoration:line-through}
.ob.disabled{pointer-events:none;opacity:.7}
.rb{display:none;background:var(--bg);border:1px solid var(--primary);border-radius:12px;padding:25px 15px;text-align:center;margin-top:20px}
.rs{font-size:36px;font-weight:700;color:var(--primary);margin:10px 0;font-family:'Merriweather',serif}
.dashboard-header{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.exam-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:600px){.exam-grid{grid-template-columns:1fr}}
.widget{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.widget-icon{font-size:32px;margin-bottom:10px}
.widget-title{font-weight:700;font-size:16px;margin-bottom:10px}
.widget-desc{font-size:13px;color:#7f8c8d;margin-bottom:15px;flex-grow:1}
.flashcard{perspective:1000px;width:100%;height:220px;cursor:pointer;margin-bottom:15px}
.fc-inner{position:relative;width:100%;height:100%;text-align:center;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:12px;font-size:16px;font-weight:600;text-align:center;line-height:1.4}
.fc-front{background:var(--card);border:2px solid var(--primary);color:var(--primary)}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg)}
#tf-area{text-align:center}
.tf-btn{flex:1;padding:15px;font-size:18px;font-weight:700;border:none;border-radius:8px;cursor:pointer;color:white;margin:0 5px}
.tf-true{background:#2ecc71}.tf-false{background:var(--red)}
.tf-btn:disabled{opacity:.6;cursor:not-allowed}
.tf-btn.correct{box-shadow:0 0 0 4px var(--gbr)}
.tf-btn.wrong{box-shadow:0 0 0 4px var(--red);opacity:.8}
.shop-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:10px;border-radius:8px;margin-bottom:10px;border:1px solid var(--border);gap:10px}
.shop-item button{width:auto;padding:6px 12px;font-size:14px}
.admin-panel{background:#fff3cd;border:1px solid #ffeeba;padding:15px;border-radius:12px;margin-bottom:20px;color:#856404}
.admin-panel button{background:#ffc107;color:#000;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px;width:100%}
.hint-btn{position:absolute;top:15px;right:15px;background:var(--gold);border:none;border-radius:50%;width:35px;height:35px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.2);z-index:5}
#lock-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.lock-card{background:var(--card);padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);max-width:400px;width:100%}
#access-code{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:16px;margin-bottom:15px;text-transform:uppercase;text-align:center;font-weight:bold;background:var(--bg);color:var(--text)}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div style="font-size:48px;margin-bottom:15px;">🔒</div>
    <h2 style="font-family:'Merriweather',serif;margin-bottom:10px;">Доступ ограничен</h2>
    <p style="color:#7f8c8d;font-size:14px;margin-bottom:20px;">Введите код доступа.</p>
    <input type="text" id="access-code" placeholder="Например: HIST-K7M2X9">
    <button onclick="checkAccess()" class="bc">Войти</button>
    <div id="lock-error" style="color:var(--red);font-size:14px;margin-top:10px;display:none;"></div>
  </div>
</div>

<div class="container">
  <!-- ИЗМЕНЕНИЕ: Добавлен счетчик подсказок -->
  <div id="peso-balance" style="display:none;">
    <span>🪙 <span id="peso-amount">0</span> Песо</span>
    <span>💡 <span id="hint-amount">0</span></span>
  </div>
  
  <div id="home">
    <div class="main-title">History by liho</div>
    <div class="books">
      <div class="book" onclick="openBook('world')">
        <img src="world.jpeg" alt="Всеобщая" class="book-cover" onerror="this.style.display='none'; this.parentElement.innerHTML += '<div class=\'book-cover\' style=\'display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#2980b9,#3498db);color:white;\'>🌍</div>';">
        <div class="bt">Всеобщая история</div><div class="bd">XVIII — начало XIX в.</div>
      </div>
      <div class="book" onclick="openBook('russia')">
        <img src="russia.jpeg" alt="Россия" class="book-cover" onerror="this.style.display='none'; this.parentElement.innerHTML += '<div class=\'book-cover\' style=\'display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:white;\'>🏛️</div>';">
        <div class="bt">История России</div><div class="bd">XVIII — начало XIX в.</div>
      </div>
    </div>
  </div>
  
  <div id="book-screen">
    <div class="header">
      <h1 id="book-title"></h1>
      <button class="btn-nav" onclick="goHome()">← На главную</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('tests')">Тесты</button>
      <button class="tab" onclick="switchTab('qa')">Вопросы</button>
      <button class="tab" onclick="switchTab('exam')">Проверка знаний</button>
    </div>
    <div id="tests-content"></div>
    <div id="qa-content" style="display:none;"></div>
    <div id="exam-content" style="display:none;"></div>
  </div>
  
  <div id="test">
    <div class="th"><div class="tt" id="ttl"></div><button class="btn-nav" onclick="goBack()">← Назад</button></div>
    <div id="qc"></div>
    <div class="rb" id="rb">
      <div style="font-weight:600;font-size:16px;">Результат:</div>
      <div class="rs" id="sd"></div>
      <div style="font-weight:600;font-size:14px;" id="pd"></div>
      <div style="font-weight:600;font-size:16px;margin-top:5px;" id="gd"></div>
      <button class="bc" onclick="restartTest()" style="margin-top:15px;">🔄 Пройти ещё раз</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ВСЕОБЩАЯ ИСТОРИЯ
   ============================================================ */
const W = [
{c:"Глава I. Век перемен", p:[
  {t:"§1. Преображение Европы", q:[
    ["Что такое модернизация?","Переход от традиционного аграрного к индустриальному обществу","Религиозное движение","Возврат к феодализму","Военная реформа",0],
    ["Что называют «европейским чудом»?","Стремительный экономический рост Европы в XVIII в.","Открытие Америки","Создание ООН","Промышленный переворот",0],
    ["Что такое «треугольная торговля»?","Из Европы товары в Африку, рабы в Америку, колониальные товары в Европу","Торговля между тремя городами","Обмен товаров на золото","Ярмарочная торговля",0]
  ], a:[
    ["Какое влияние оказала Научная революция на экономическое развитие стран Европы?","Научная революция соединила науку с практикой и дала толчок изобретениям: телескоп, микроскоп, барометр, термометр, паровой двигатель, новые вооружения. Эти открытия находили применение в промышленности, мореплавании и военном деле. В итоге наука стала двигателем экономического роста и заложила основу будущей промышленной революции."],
    ["Какие новые возможности открыла транспортная революция?","Улучшились дороги, появились платные шоссе и новые повозки, выросли скорость и грузоподъёмность перевозок. Расширилось строительство каналов, а реки стали удобнее для навигации. Это удешевило доставку тяжёлых грузов (уголь, металлы) и оживило внутреннюю и внешнюю торговлю."],
    ["Какие факторы обусловили начало модернизации стран Европы?","Удачное географическое положение, политическая раздробленность и конкуренция государств, Реформация, Великие географические открытия, Научная революция и рост грамотности. Соединение науки с практикой и развитие капитализма расшатывали традиционный порядок. Всё это вместе создало условия для перехода к индустриальному обществу."],
    ["В чём состояло европейское разделение труда?","Страны перестали стремиться обеспечить себя всем необходимым и специализировались на том, что у них получалось лучше. Восточная Европа поставляла зерно, лён, пеньку; Северная — металлы; Англия — ткани и промышленные товары; Франция — предметы роскоши и моды. Такая специализация усилила торговые связи и взаимозависимость европейских стран."]
  ]},
  {t:"§2. Эпоха Просвещения", q:[
    ["Что такое Просвещение?","Идейное течение, основанное на разуме, свободе и веротерпимости","Религиозное движение","Реформа армии","Колониальная политика",0],
    ["Кто автор теории разделения властей?","Монтескьё","Вольтер","Руссо","Дидро",0],
    ["Кто написал «Об общественном договоре» (1762)?","Руссо","Монтескьё","Вольтер","Локк",0]
  ], a:[
    ["Что такое рационализм? В чём его достоинства, недостатки?","Рационализм — это убеждение, что разум является главным источником знаний и критерием истины. Достоинство — он способствовал развитию науки и критическому мышлению. Недостаток — просветители склонны были объявлять «предрассудками» всё, чего не могли объяснить сами, а возможности любого разума ограничены."],
    ["Как вы думаете, почему во время Французской революции идею о естественных правах человека будут назвать «оружием разрушителей»?","Теория естественных прав утверждала, что люди рождаются равными и наделены неотъемлемыми правами. Критики указывали, что произвольно составленный перечень таких прав позволяет обвинить любое правительство в их нарушении. На этом основании можно потребовать низвержения власти, что и происходило в годы революции."],
    ["Сравните, как трактовал теорию разделения властей Дж. Локк и у Монтескьё. Что в них общего и в чём различия?","Локк предлагал выделять три ветви: законодательную, исполнительную и федеративную (внешняя политика). Монтескьё предложил другую триаду: законодательную, исполнительную и судебную. Общее — идея разделения властей, различие — состав ветвей и, у Монтескьё, акцент на их взаимном уравновешивании."],
    ["С чем, по-вашему, связано двойственное отношение Вольтера к церкви и религии?","Вольтер резко критиковал католическую церковь («раздавите гадину») и выступал за веротерпимость. При этом он считал, что простому народу религия необходима как нравственная опора. Отсюда и двойственность: просветительская критика для образованных и сохранение веры для «черни»."],
    ["Какие виды интеллектуальных клубов существовали в Европе в XVIII в.?","Читательские клубы, академии, литературные салоны и кафе. В клубах и салонах обсуждали новости науки, литературы и политики, а в кафе можно было познакомиться со свежими газетами. Эти формы публичного общения стали основой будущей политической жизни."]
  ]},
  {t:"§3. Общество Старого порядка", q:[
    ["Что такое нация?","Историческая общность людей с общим языком, культурой и историей","Сословие","Религиозная группа","Армия",0],
    ["Что такое космополитизм?","Идеология, рассматривающая людей как граждан мира","Национализм","Патриотизм","Клерикализм",0],
    ["Кто написал брошюру «Что такое третье сословие?» (1789)?","Э. Ж. Сийес","Мирабо","Лафайет","Робеспьер",0]
  ], a:[
    ["Какие изменения происходили в положении дворянского сословия в течение XVIII в.?","Дворянство беднело из-за революции цен и утраты налоговых привилегий, государственные чиновники оттесняли его от управления на местах. Наиболее активные дворяне начинали заниматься предпринимательством, вкладывали средства в металлургию и капиталистическую аренду. Часть дворян увлекалась идеями Просвещения и выступала за реформы."],
    ["Чем отличалась семья в XVIII в. от современной семьи?","Брак был прежде всего социальным и экономическим союзом, основанным на расчёте, а не на любви. Семьи создавались поздно, роли супругов были чётко распределены: муж содержал семью, жена вела хозяйство. Разводы были редкостью, а детей часто отдавали кормилицам и рано приучали к труду."],
    ["Какие причины приводили к увеличению числа бедняков в деревне и в городе в XVIII в.?","В деревне капиталистические преобразования разоряли часть крестьян, которые теряли землю и превращались в наёмных работников. В городах рост населения и разорение ремесленников пополняли число безработных и нищих. Особенно много было бедняков среди городских низов — безработных, калек, сирот."],
    ["Как изменилось положение детей в XVIII в. по сравнению с ранним Новым временем? Чем можно объяснить эти изменения?","В XVIII в. отказываются от тесного пеленания, детям выделяют отдельные комнаты, появляются детские книги и игрушки. Ребёнка всё меньше воспринимают как «маленького взрослого» и всё больше — как существо, которое нужно воспитывать и образовывать. Это связано с идеями Просвещения и с изменением взгляда на человека как на формируемую личность."],
    ["Найдите картины художников XVIII в., на которых показаны дети. Выявите общее и различное в изображениях детей.","В живописи XVIII в. дети изображаются уже не как маленькие взрослые, а как самостоятельные персонажи: в семейных портретах, играх, за чтением. Общее — интерес к детству как особому периоду жизни, к детским играм и эмоциям. Различное — в зависимости от сословия: дети аристократов изображаются в парадных костюмах, крестьянские — за работой."]
  ]},
  {t:"§4. Государство Старого порядка", q:[
    ["Сколько республик было в Европе XVIII в.?","Четыре","Две","Одна","Восемь",0],
    ["Что такое просвещённый абсолютизм?","Политика реформ монархов, созвучная идеям Просвещения","Отмена монархии","Введение республики","Отделение церкви",0],
    ["Кто был королём Испании в 1759–1788 гг.?","Карл III","Карл II","Филипп V","Фердинанд VI",0]
  ], a:[
    ["Какой государственный строй давал наибольшие возможности для проведения реформ в странах Европы XVIII в.?","Просвещённый абсолютизм давал наибольшие возможности, потому что власть монарха была достаточно сильной, чтобы преодолеть сопротивление привилегированных сословий. Абсолютный монарх мог провести реформы сверху, не оглядываясь на парламент или сословные собрания. В республиках же власть принадлежала узкому кругу олигархов, которые сопротивлялись любым переменам."],
    ["Какие реформы в рамках политики просвещённого абсолютизма были созвучны идеям просветителей, а какие нет?","Созвучны были реформы образования, запрет пыток, веротерпимость, ограничение зависимости крестьян от сеньоров. Не созвучны были укрепление централизации, усиление армии и бюрократии, сохранение абсолютизма. Просветители мечтали об ограничении власти монарха, а реформаторы, наоборот, её укрепляли."],
    ["В чём сходство и в чём различие политики просвещённого абсолютизма, проводившейся министрами Карла III в Испании и Помбалом в Португалии?","Сходство: изгнание иезуитов, реформа образования, поддержка промышленности и торговли, ограничение влияния церкви. Различие — в методах: Помбал действовал жёстко и деспотично (пытки, казни, подавление восстаний), а реформы в Испании проводились более осторожно. Результаты тоже различались: Помбала после смерти короля отправили в ссылку, а реформы Карла III сохранились."],
    ["К каким изменениям в образовании привело изгнание иезуитов из Испании и Португалии?","Корона взяла университеты под своё покровительство, расширила преподавание естественных и точных наук за счёт теологии и права. Появились высшие технические учебные заведения, ремесленные училища, школы. Образование стало более светским и ориентированным на практические нужды государства."],
    ["Маркиз Помбал окончил свои дни в опале, а сегодня его именем названа одна из центральных площадей Лиссабона. Как вы думаете, почему?","Помбал восстановил Лиссабон после землетрясения 1755 г., провёл реформы образования и экономики, укрепил государство. Несмотря на деспотические методы, его преобразования надолго определили облик и развитие Португалии. Потомки оценили результаты его деятельности, а не личные качества."]
  ]},
  {t:"§5–6. В поисках европейского равновесия", q:[
    ["Что такое европейское равновесие?","Порядок, при котором ни одна из великих держав не имеет решающего преимущества","Союз всех монархий","Раздел Европы","Война всех против всех",0],
    ["Что такое пентархия?","Пять великих держав: Франция, Англия, Австрия, Пруссия, Россия","Пять республик","Пять религий","Пять империй",0],
    ["В какие годы шла Семилетняя война?","1756–1763","1700–1721","1775–1783","1805–1815",0]
  ], a:[
    ["Какие изменения произошли в системе международных отношений после Войны за испанское наследство и Северной войны?","В Европе не осталось безоговорочных гегемонов: Франция ослабла, Швеция утратила господство на Балтике. На смену гегемонии двух государств пришло европейское равновесие пяти великих держав. Россия вошла в число великих держав."],
    ["Почему XVIII столетие историки порой называют «веком коалиций»?","Ни одна великая держава не решалась воевать в одиночку, поэтому против усиливающегося противника создавались коалиции. Состав коалиций менялся в зависимости от интересов, что делало войны затяжными и масштабными. При заключении мира державы стремились сохранить равновесие, чтобы никто не получил слишком большого преимущества."],
    ["Почему в Европе на протяжении большей части XVIII в. было невозможно появление нового гегемона?","Пять великих держав уравновешивали друг друга и объединялись против того, кто пытался усилиться. Ни одна из них не могла в одиночку противостоять остальным. Поэтому любая попытка установить гегемонию наталкивалась на коалицию."],
    ["В чём особенности той роли, которую Россия играла в отношениях между великими державами?","Россия не имела непримиримых противоречий ни с одной из великих держав, поэтому могла сотрудничать с любой из них. Её вмешательство нередко решало исход их противоборства. Канцлер Безбородко говорил: «При нас ни одна пушка в Европе без позволения нашего выпалить не смела»."],
    ["Какие изменения произошли в способах ведения войны в XVIII в.?","Войны стали менее ожесточёнными: пленных больше не уничтожали, их обменивали. Появилась идея короткой войны — быстрый манёвр и разгром неприятеля в генеральном сражении. На смену наёмникам пришли профессиональные армии с казармами, униформой и военными школами."],
    ["Почему именно Великобритания обладала самым большим флотом в мире?","Активная колониальная политика морской державы требовала большого военного флота, и Великобритания вкладывала в него огромные средства. К концу XVIII в. у неё было более 170 линейных кораблей. Флот обеспечивал ей господство на морях и защиту колониальной империи."],
    ["Чем определялся разный состав коалиций в Войне за австрийское наследство и в Семилетней войне?","В Войне за австрийское наследство Великобритания помогала Австрии против Франции и Пруссии. В Семилетней войне Англия выступила союзницей Пруссии, а Франция — Австрии и России. Такой «обмен союзниками» объяснялся изменением интересов: Англия стремилась ослабить Францию в колониях, а Франция — не дать Пруссии усилиться."],
    ["Почему историки иногда называют Семилетнюю войну «нулевой мировой войной»?","Боевые действия шли не только в Европе, но и в Америке, Индии, на морях. В войне участвовали все великие державы того времени и их союзники. По масштабу и глобальному характеру она предвосхитила мировые войны XX в."],
    ["Почему Великобритания смогла в XVIII в. выиграть у Франции борьбу за колонии?","Англия сосредоточила усилия на колониальной экспансии, тогда как Франция распыляла силы между колониями и континентом. Английский флот был сильнее французского. Кроме того, английская экономика и финансовая система были прочнее французской."]
  ]},
  {t:"§7. Успешные и безуспешные реформы французских королей", q:[
    ["Кто был королём Франции в 1715–1774 гг.?","Людовик XV","Людовик XIV","Людовик XVI","Карл X",0],
    ["Что такое французские парламенты?","Высшие суды, а не законодательные органы","Законодательные органы","Правительство","Армия",0],
    ["Кто провёл судебную реформу 1770–1774 гг.?","Канцлер Мопу","Тюрго","Людовик XV","Мирабо",0]
  ], a:[
    ["Перечислите факторы, обеспечившие мощный экономический рост Франции Старого порядка.","Расширение колониальной торговли (рост в 4 раза, второе место в мире после Англии), развитие промышленности и судостроения, тяжёлая индустрия с использованием каменного угля. Успехи сельского хозяйства (рост производства на 40%). Рост населения до 30 млн человек."],
    ["Что представляли собой французские парламенты? Можно ли их отождествлять с английским парламентом?","Французские парламенты были высшими судами, а не законодательными органами, как в Англии. Они имели право регистрировать королевские законы и могли отказываться это делать, что давало им политическое влияние. Отождествлять их с английским парламентом нельзя: у них не было законодательной власти."],
    ["Чем собрание нотаблей отличалось от Генеральных штатов?","В Генеральные штаты депутатов избирали, а нотаблей приглашал король из угодных ему людей. Нотабли были малым подобием Генеральных штатов, собранным из знати, духовенства и верхов третьего сословия. Собрание нотаблей 1787 г. оказалось безрезультатным: нотабли отказались решать вопросы налоговой реформы."],
    ["Можно ли правление Людовика XV и Людовика XVI назвать просвещённым абсолютизмом? Свой ответ обоснуйте.","В целом нет: реформы постоянно проваливались из-за сопротивления привилегированных сословий, монархи не смогли преодолеть это сопротивление. Не было и последовательности: начатые реформы отменялись. Отдельные реформы (Мопу, Тюрго) были созвучны идеям Просвещения, но в целом политика оставалась непоследовательной."],
    ["Почему министрам Людовика XV удалось успешно осуществить военную реформу, а налоговую нет?","Военная реформа не затрагивала интересы привилегированных сословий, а наоборот, укрепляла армию, где дворяне занимали офицерские должности. Налоговая реформа покушалась на налоговые привилегии дворянства и духовенства. Они оказали упорное сопротивление, и реформа провалилась."],
    ["Что общего между налоговыми реформами Людовика XV и Людовика XVI и в чём между ними различие?","Общее: обе реформы пытались ввести всесословный поземельный налог, обе провалились из-за сопротивления привилегированных. Различие: при Людовике XV речь шла о налоге в 5% (одна двадцатая), а при Людовике XVI — о более решительной реформе. Причина в финансовой ситуации: после Войны за независимость США (1 млрд ливров долга) выплаты процентов составляли половину бюджета."]
  ]},
  {t:"§8–9. Германские земли и монархия Габсбургов", q:[
    ["Что такое «второе издание крепостничества»?","Усиление крепостного права в областях восточнее Эльбы","Отмена крепостного права","Реформа налогов","Создание армии",0],
    ["Кто был королём Пруссии в 1740–1786 гг.?","Фридрих II","Фридрих Вильгельм I","Фридрих I","Вильгельм I",0],
    ["Кто была Мария Терезия?","Эрцгерцогиня Австрии, императрица Священной Римской империи","Королева Франции","Королева Англии","Княгиня Пруссии",0]
  ], a:[
    ["Какие последствия — демографические, экономические и политические — оказала Тридцатилетняя война на германские земли?","Демографические: огромные потери населения. Экономические: нехватка рабочих рук, «второе издание крепостничества» восточнее Эльбы, упадок городов. Политические: закрепление раздробленности, превращение власти императора в символическую. Наиболее негативным было политическое последствие — Вестфальский мир закрепил раздробленность Германии на два столетия."],
    ["Почему Фридрих II, в отличие от своего отца — «короля-солдата», не жалел денег на строительство дворцов и поддержку искусств?","Для Фридриха II дворцы и искусства были атрибутом великой державы, способом утвердить престиж Пруссии в Европе. Он строил резиденции (Сан-Суси), учредил Королевскую оперу и Берлинскую академию наук. Это соответствовало образу «философа на троне» — просвещённого монарха."],
    ["Каким образом Фридрих II повлиял на модернизацию монархии Габсбургов?","Своими победами и претензиями на Силезию он показал военное превосходство Пруссии и вынудил Марию Терезию провести срочные реформы. Её военная, налоговая и образовательная реформы были ответом на прусскую угрозу. Так Фридрих II косвенно стал «двигателем» модернизации Австрии."],
    ["Сравните реформы Марии Терезии и Иосифа II по глубине и результату.","Реформы Марии Терезии были более осторожными и учитывали исторические реалии, поэтому дали прочные результаты (военная, налоговая, образовательная, судебная). Реформы Иосифа II были глубже и радикальнее, но проводились без учёта местных особенностей и вызвали кризис (восстание в Бельгии, угроза мятежа в Венгрии). В итоге Иосиф II был вынужден отменить административную реформу накануне смерти."]
  ]},
  {t:"§10. Повседневная жизнь европейцев: старое и новое", q:[
    ["Что такое урбанизация?","Рост городов и повышение их роли в обществе","Строительство деревень","Перепись населения","Транспортная реформа",0],
    ["Какой город был самым большим в Европе в XVIII в.?","Лондон","Париж","Вена","Рим",0],
    ["Что такое комод?","Мебель с выдвижными ящиками для белья","Стол для письма","Шкаф для книг","Стул",0]
  ], a:[
    ["Что нового появилось в европейских городах в XVIII в.?","Регулярная планировка, широкие прямые улицы и площади, таблички с названиями улиц и нумерацией домов. Уличное освещение (фонари), мощение, вынос кладбищ за черту города. Появление полиции, новые общественные здания, театры, набережные."],
    ["Что, с вашей точки зрения, мешало в XVIII в. сделать город более современным?","Отсутствие водопровода и канализации, скученность населения, недостаток средств у городских властей. Эпидемии тифа, дизентерии, чумы и оспы продолжались. Многие усовершенствования были возможны только в богатых кварталах, а бедные оставались в антисанитарных условиях."],
    ["Выделите в рационе питания европейцев традиционные и новые продукты.","Традиционные: хлеб, каши из зерновых, овощи, мясо (редко), рыба, пиво, вино. Новые (из Нового Света): картофель, кукуруза, помидоры, фасоль, индейка. Также колониальные товары — сахар, кофе, чай, шоколад."],
    ["Как вы думаете, почему богатые европейцы начинают всё больше следить за модой?","Мода была способом подчеркнуть статус и отличие от низших сословий. Укрепление торговых связей с Востоком дало доступ к новым тканям и товарам. Иллюстрированные журналы и манекены распространяли парижские образцы по всей Европе, превращая моду в самостоятельную индустрию."]
  ]},
  {t:"§11. Наука, образование, воспитание", q:[
    ["Кто создал классификацию растений и животных?","Карл Линней","Лаплас","Лавуазье","Эйлер",0],
    ["Кто открыл Уран в 1781 г.?","Уильям Гершель","Лаплас","Эйлер","Линней",0],
    ["Кто открыл кислород и создал новую классификацию химических соединений?","Лавуазье","Ломоносов","Бертолле","Эйлер",0]
  ], a:[
    ["Докажите, что развитие науки и философии Просвещения связаны между собой.","Просветители опирались на достижения Научной революции и верили в силу разума, что и было основой их философии. Научные открытия (Линней, Лаплас, Лавуазье) показывали, что мир познаваем разумом, а это укрепляло просветительские идеи. В свою очередь, философия Просвещения пропагандировала науку и образование."],
    ["Подготовьте презентацию об одном из экономистов XVIII в. (например, об Адаме Смите).","Адам Смит написал «Исследование о природе и причинах богатства народов» (1776). Он обосновал идею «невидимой руки» рынка и доказывал, что свободная конкуренция и невмешательство государства ведут к богатству нации. Смит считается основателем современной экономической науки."],
    ["Выделите новые черты в образовании XVIII в. и объясните эти изменения.","Государство берёт образование под контроль, делает его светским, централизованным и унифицированным. Появляются реальные школы с практическими знаниями, растёт число специализированных высших учебных заведений (военные, инженерные, педагогические). Причина — потребность государства в квалифицированных кадрах."],
    ["Объясните связь между изменением отношения к воспитанию детей в XVIII в. и научной революцией.","Научная революция показала, что мир познаваем и его можно изменять. По аналогии возникла идея, что и человека можно и нужно формировать через воспитание. Поэтому появилось понятие «воспитанный ребёнок», а книги о воспитании стали массово востребованы."]
  ]},
  {t:"§12–13. Культурное пространство Европы", q:[
    ["Какие стили существовали в искусстве XVIII в.?","Барокко, рококо, классицизм, сентиментализм","Только классицизм","Только барокко","Только рококо",0],
    ["Кто написал «Робинзона Крузо»?","Даниель Дефо","Джонатан Свифт","Гёте","Бомарше",0],
    ["Кто написал «Путешествия Гулливера»?","Джонатан Свифт","Даниель Дефо","Гёте","Бомарше",0]
  ], a:[
    ["Почему, по-вашему, в эпоху Просвещения стал столь популярен классицизм?","Классицизм обращался к античным образцам, а в Античности просветители видели пример разумного устройства общества и героические идеалы. Строгость линий и простота форм соответствовали духу рациональности. Классицизм воспевал гражданские добродетели, что было близко идеям Просвещения."],
    ["Какие направления существовали в литературе XVIII в.?","Просветительский роман (Дефо, Свифт), сентиментализм (Ричардсон, Гёте), готический роман, классицистическая драма (Бомарше). Появляется роман в письмах."],
    ["Назовите и охарактеризуйте выдающихся композиторов XVIII в.","Бах (органная музыка, синтез церковного и светского), Гендель (оперы, оратории), Вивальди («Времена года»), Гайдн (симфонии), Моцарт (оперы, симфонии — «Свадьба Фигаро», «Дон Жуан»). Их творчество соединило барочные традиции с новыми светскими формами."],
    ["Проследите связь идей, заложенных в романе «Робинзон Крузо», с протестантизмом.","Робинзон, попав на остров, не унывает и полагается на себя и на Бога. Труд, бережливость, вера в собственные силы — это протестантские ценности. Книга воспринималась как гимн человеку, ведомому Богом."]
  ]}
]},
{c:"Глава II. Начало революционной эпохи", p:[
  {t:"§14. Великобритания: промышленная революция", q:[
    ["В какие годы произошла промышленная революция в Англии?","1760–1840-е","1700–1750","1800–1850","1750–1800",0],
    ["Кто изобрёл прялку «Дженни» около 1765 г.?","Джеймс Харгривс","Джеймс Уатт","Ричард Аркрайт","Сэмюэл Кромптон",0],
    ["Кто создал универсальный паровой двигатель в 1784 г.?","Джеймс Уатт","Томас Ньюкомен","Ричард Тревитик","Джордж Стефенсон",0]
  ], a:[
    ["Проанализируйте иллюстрацию в начале параграфа. Как вы думаете, художник относился к промышленной революции положительно или отрицательно?","Картина «Коалбрукдейл ночью» изображает огненное зарево над заводами и дым. Это скорее тревожный, двойственный образ: промышленность и величественна, и пугающа. Художник, вероятно, видит в ней не только прогресс, но и разрушение прежнего мира."],
    ["Почему, несмотря на все различия, Англия, Шотландия и Уэльс слились в одно государство?","Объединяющим фактором была протестантская вера, общие религиозные традиции и праздники. Общность языка, торговых интересов и военно-морского могущества. Уния 1707 г. дала Шотландии доступ к английским рынкам и колониям, что было выгодно её элите."],
    ["Объясните, почему промышленная революция произошла именно в Англии.","Аграрная революция обогатила деревню и создала спрос на промышленные товары. Рост населения дал свободную рабочую силу. Запасы каменного угля и железа обеспечили топливо и материалы. Капиталы накапливались в банках, а низкий процент по кредитам облегчал инвестиции. Политическая стабильность и парламентская монархия поддерживали предпринимательство."],
    ["Для чего была нужна промышленная революция?","Рост спроса (из-за обогащения деревни, роста населения и колоний) превысил возможности мануфактур. Машины позволили резко увеличить производство и снизить издержки. Без машинного производства Англия не смогла бы удовлетворить спрос на ткани и другие товары."]
  ]},
  {t:"§15. Британские колонии против метрополии. Образование США", q:[
    ["Когда была принята Декларация независимости США?","4 июля 1776","1783","1787","1775",0],
    ["Кто был главнокомандующим армии колонистов?","Джордж Вашингтон","Томас Джефферсон","Бенджамин Франклин","Джон Адамс",0],
    ["Когда была принята Конституция США?","1787","1776","1789","1791",0]
  ], a:[
    ["Можно ли сказать, что принципы соглашения, заключённого на «Мэйфлауэре», были воплощены в системе управления североамериканскими колониями?","Да, в значительной мере: в колониях действовали выборные законодательные собрания, а депутаты избирались жителями. Принцип самоуправления, заложенный в «Мэйфлауэре», сохранялся. Но полного равенства не было: права не распространялись на рабов, индейцев и неимущих."],
    ["Как в общественной жизни колоний проявлялось расовое неравенство?","Чернокожие рабы были полностью бесправны и работали на плантациях пожизненно. Индейцев вытесняли с земель и истребляли. Сервенты (белые кабальные слуги) после отработки срока становились свободными, но до этого их положение было близко к рабскому."],
    ["Почему можно сказать, что в результате Семилетней войны Великобритания завоевала Индию, но потеряла Америку?","В Семилетней войне Англия разбила Францию и захватила её колонии в Индии и Канаде. Но война истощила казну, и правительство решило обложить налогами американские колонии. Это привело к конфликту и Войне за независимость, в результате которой Англия потеряла Америку."],
    ["Почему вопрос о введении достаточно ограниченных налогов оказался критическим для отношений между колониями и метрополией?","Колонисты не имели представителей в британском парламенте, поэтому считали, что парламент не имеет права их облагать налогами. Речь шла не о сумме, а о принципе: «нет налогообложения без представительства». Уступка в этом вопросе означала бы признание власти парламента над колониями."],
    ["Каким образом США смогли добиться перелома в Войне за независимость?","Победа при Саратоге (1777) убедила Францию вступить в войну на стороне колоний. Французский флот и войска помогли блокировать английскую армию при Йорктауне (1781). После капитуляции Йорктауна Англия была вынуждена пойти на мир."],
    ["Соотнесите вклад Франции в Войну за независимость США и полученный ею результат: они сопоставимы?","Нет, не сопоставимы: Франция потратила 1 млрд ливров и потеряла флот, но получила лишь небольшие приобретения. Война ускорила финансовый кризис, который привёл к Французской революции. Так что вклад был огромным, а результат — отрицательным."],
    ["Зачем потребовалось сразу же после принятия новой Конституции США вносить в неё поправки, принимая «Билль о правах»?","Авторы Конституции, заботясь о сильной центральной власти, не прописали права и свободы граждан. Штаты при ратификации указали на этот недостаток. Поэтому в 1791 г. были приняты 10 поправок, гарантирующих свободу вероисповедания, слова, печати, собраний и неприкосновенность личности."]
  ]},
  {t:"§16. Французская революция: конец Старого порядка", q:[
    ["Когда началась Великая французская революция?","14 июля 1789","1788","1792","1799",0],
    ["Что такое Учредительное собрание?","Высший законодательный орган Франции в 1789–1791 гг.","Правительство","Суд","Армия",0],
    ["Когда была принята Декларация прав человека и гражданина?","26 августа 1789","14 июля 1789","1791","1793",0]
  ], a:[
    ["Составьте в тетради таблицу революционных преобразований за период 1789–1792 гг.","Ключевые преобразования: отмена сословий и титулов, Декларация прав человека и гражданина (1789), национализация церковного имущества, новое административное деление на департаменты, отмена внутренних таможен, Конституция 1791 г., провозглашение республики (сентябрь 1792)."],
    ["Обсудите в классе, можно ли было, с вашей точки зрения, предотвратить революцию.","Революцию можно было предотвратить, если бы Людовик XVI провёл налоговую реформу и допустил третье сословие к управлению. Но сопротивление привилегированных сословий и нерешительность короля сделали это невозможным. Когда Генеральные штаты собрались, компромисс уже был упущен."],
    ["Почему санкюлоты разочаровались в монархии?","Санкюлоты (городская беднота) не получили от революции того, чего ждали: хлеба, работы, участия в управлении. Когда король попытался бежать (Варенн, июнь 1791), стало ясно, что он не на стороне революции. После этого санкюлоты стали требовать свержения монархии, что и произошло 10 августа 1792 г."],
    ["Сравните деятельность Людовика XVI во Франции и Карла I в Англии. Можно ли выявить общие черты и различия?","Общее: оба короля не смогли найти компромисс с парламентом/сословиями, оба пытались бежать, оба были казнены. Различия: Карл I был казнён в ходе революции в 1649 г., Людовик XVI — в 1793 г.; во Франции революция была более радикальной и масштабной, чем в Англии."]
  ]},
  {t:"§17–18. Французская республика: диктатура и террор", q:[
    ["Кто был лидером монтаньяров?","Максимильен Робеспьер","Дантон","Марат","Бриссо",0],
    ["Когда был казнён Людовик XVI?","21 января 1793","14 июля 1789","10 августа 1792","9 термидора",0],
    ["Что такое Комитет общественного спасения?","Главный комитет Конвента, фактическое правительство","Суд","Парламент","Армия",0]
  ], a:[
    ["Какие группировки были представлены в Конвенте? Сравните их политические программы.","Жирондисты (стремились завершить революцию, восстановить закон и порядок, не одобряли чрезвычайные меры) и монтаньяры (продолжали революцию, опирались на санкюлотов, требовали радикальных мер). Также была «Равнина» («Болото») — депутаты, не примыкавшие ни к тем, ни к другим, они поддерживали того, кто был сильнее."],
    ["Используя дополнительные источники, подготовьте рассказ об одном из деятелей революции (например, о Робеспьере).","Робеспьер — адвокат из Арраса, лидер Якобинского клуба, член Комитета общественного спасения. Он был идейным вдохновителем террора, но сам жил аскетично и получил прозвище «Неподкупный». Казнён в 1794 г. после переворота 9 термидора."],
    ["Используя ресурсы Интернета и другие источники информации, подготовьте сообщение о перевороте 9 термидора.","27 июля 1794 г. (9 термидора II года) в Конвенте был организован заговор против Робеспьера и его сторонников. Робеспьер, Сен-Жюст и Кутон были арестованы и на следующий день казнены. Переворот положил конец якобинской диктатуре и террору."]
  ]},
  {t:"§19. Революционная Франция против Европы", q:[
    ["Когда образовалась Первая антифранцузская коалиция?","1793","1798","1805","1806",0],
    ["Кто командовал французской армией в Италии в 1796 г.?","Наполеон Бонапарт","Моро","Гош","Журдан",0],
    ["В какие годы произошёл Египетский поход Наполеона?","1798–1801","1796–1797","1805–1807","1812–1814",0]
  ], a:[
    ["Почему территориальную экспансию, проводившуюся Французской республикой, иногда называют «экспортом революции»?","Франция объявила, что несёт «свободу» другим народам, и создавала на оккупированных территориях «братские» республики. Но на деле эти территории подвергались ограблению, а их ресурсы шли на нужды Франции. Поэтому «экспорт революции» был прикрытием для территориальной экспансии."],
    ["Сравните аннексии соседних провинций, осуществлённые революционной Францией, и разделы Речи Посполитой.","Общее: и там, и там происходил захват чужих территорий, прикрытый разными идеями. Различия: разделы Польши проводились монархиями (Пруссией, Австрией, Россией), а аннексии Франции — республикой под лозунгом «народного суверенитета». Франция аннексировала Авиньон, Ниццу, Савойю, Бельгию."],
    ["Что обеспечило победу Франции над Первой и Второй коалициями?","Массовые призывы дали численное превосходство французской армии. Разобщённость действий в коалициях (каждая страна преследовала свои интересы). Высокий боевой дух французских солдат, воспитанных в духе «Великой нации»."],
    ["Почему основная масса населения оккупированных французами стран не поверила лозунгам «свободы» и «равенства», под которыми пришли войска Французской республики?","Французы грабили оккупированные территории, вводили контрибуции, вывозили произведения искусства. Местное население видело в них завоевателей, а не освободителей. В Италии и Испании развернулась партизанская война против французов."],
    ["Как вы думаете, почему французы в Египте считали возможным совершать действия (применение пыток, торговля рабами), запрещённые у них на родине?","В Египте французы не считали местное население равным себе, поэтому нормы, принятые во Франции, на них не распространялись. Колониальная практика оправдывала любые методы для получения ресурсов. Это показывает разрыв между провозглашаемыми идеалами и реальной политикой."]
  ]},
  {t:"§20. Завершение Французской революции и её итоги", q:[
    ["Что такое Термидор?","Период после свержения Робеспьера (1794–1795)","Орган власти","Партия","Война",0],
    ["Что такое Директория?","Орган исполнительной власти из 5 человек (1795–1799)","Парламент","Суд","Армия",0],
    ["Когда произошёл переворот 18 брюмера?","9 ноября 1799","14 июля 1789","27 июля 1794","18 июня 1815",0]
  ], a:[
    ["Проанализируйте, чем был Термидор: завершением революции или отказом от её завоеваний.","Термидор был и тем, и другим: с одной стороны, он покончил с террором и диктатурой, вернул свободу слова и освободил заключённых. С другой — он сохранил основные завоевания революции (республика, равенство перед законом, отмена сословий). Термидорианцы искали компромисс, но не отказались от революционных принципов."],
    ["Как вы думаете, почему в конце революции к власти решили привести военного, а не политика?","Общество устало от политической нестабильности, переворотов и «политики качелей». Армия казалась единственной реальной силой, способной навести порядок. Наполеон был популярным генералом, чьи победы сделали его символом стабильности и славы."],
    ["Каковы были итоги революции в экономической сфере?","Революция уничтожила феодальные привилегии и сеньориальные права, появились сотни тысяч новых земельных собственников. Но закрепилось мелкое крестьянское землевладение, что тормозило развитие капитализма. Войны и обесценивание денег подорвали торговлю и промышленность, Франция стала отставать от Англии."],
    ["Каковы, на ваш взгляд, наиболее важные итоги революции?","Уничтожение Старого порядка и сословного деления, установление равенства перед законом. Принципы свободы, прав человека, народного суверенитета стали основой современной политической системы. Революция изменила политическую карту Европы и оказала влияние на всё последующее развитие."]
  ]},
  {t:"§21–22. Империя Наполеона Бонапарта: от триумфа до краха", q:[
    ["Когда Наполеон стал императором французов?","1804","1799","1812","1815",0],
    ["Что такое Гражданский кодекс (Кодекс Наполеона)?","Свод законов 1804 г., основа современного гражданского права","Военный устав","Конституция","Торговый договор",0],
    ["Когда был заключён Тильзитский мир?","1807","1805","1809","1812",0]
  ], a:[
    ["Чем отличался характер власти Наполеона от характера правления в других европейских монархиях?","Наполеон правил единолично, хотя формально Франция была конституционной монархией. Его власть опиралась не на право наследования, а на армию, пропаганду и общественное мнение. Титул «император французов» подчёркивал, что он правит от имени народа."],
    ["Каковы причины Наполеоновских войн?","Стремление Наполеона к гегемонии в Европе и личные амбиции. Англо-французское соперничество за колонии и торговлю. Новое дворянство и буржуазия, созданные Наполеоном, были заинтересованы в войнах и контрибуциях."],
    ["Как вам кажется, была ли война 1812 г. неизбежной? Свой ответ обоснуйте.","Война была неизбежной, потому что Россия нарушала континентальную блокаду, а Наполеон не мог допустить этого. Кроме того, Россия оставалась единственной державой, сохранявшей самостоятельность в континентальной Европе. Наполеону нужна была победоносная война, чтобы укрепить свою власть внутри Франции."],
    ["Одно из важнейших сражений называлось «битва трёх императоров», другое — «битва народов». Что это за сражения?","«Битва трёх императоров» — Аустерлиц (1805), где сражались Наполеон, Александр I и Франц II. «Битва народов» — Лейпциг (1813), где против Наполеона объединились Россия, Пруссия, Австрия и Швеция. Эти названия отражают изменение характера войн: от войн монархов к войнам народов."],
    ["Опираясь на карту 3 и текст учебника, составьте таблицу «Наполеоновские войны».","Например: Третья коалиция (1805) — Англия, Россия, Австрия, Швеция; причины — стремление остановить Наполеона; сражения — Аустерлиц, Трафальгар; итоги — победа Наполеона, распад коалиции. Четвёртая (1806–1807) — Пруссия, Россия; Йена, Ауэрштедт, Фридланд; Тильзитский мир."],
    ["Используя дополнительные источники, подготовьте презентацию о Ж.-Л. Давиде «Первый художник императора».","Давид создал парадные портреты Наполеона: «Наполеон на перевале Сен-Бернар», «Коронация», «Наполеон в кабинете». Образ менялся от героического к более сдержанному и официальному. Эти картины служили пропаганде и создавали «наполеоновскую легенду»."]
  ]}
]},
{c:"Глава III. Страны Азии, Африки и Латинской Америки в XVIII — начале XIX в.", p:[
  {t:"§23–24. Вокруг света во времена капитана Кука", q:[
    ["Кто доказал, что Америка отделена от Азии проливом?","Витус Беринг","Джеймс Кук","Лаперуз","Бугенвиль",0],
    ["Сколько экспедиций совершил Джеймс Кук?","Три","Две","Одну","Четыре",0],
    ["Кто возглавил французскую кругосветную экспедицию 1785–1788 гг.?","Лаперуз","Бугенвиль","Кук","Гумбольдт",0]
  ], a:[
    ["Рассмотрите иллюстрацию в начале параграфа. Как вы думаете, почему король считает нужным лично инструктировать мореплавателя?","Экспедиция Лаперуза была государственным делом, и Людовик XVI лично давал инструкции. Король подчёркивал важность открытий для Франции и её престижа. Это свидетельствует о том, что путешествия были тесно связаны с политикой."],
    ["Какую роль сыграли путешествия в развитии европейской науки и культуры XVIII в.?","Они расширили представления о мире, позволили лучше узнать другие народы и природу. В экспедициях участвовали учёные (астрономы, ботаники, географы), которые собирали научные данные. Путешествия повлияли на литературу и искусство, дав материал для описаний и сюжетов."],
    ["Почему мореплаватели так упорно искали Южную землю? Чем закончились эти поиски?","Географы считали, что суша в Южном полушарии должна уравновешивать сушу Северного. Поиски велись с XVI в., но Кук во втором плавании опроверг существование обширной Южной земли в умеренных широтах. Только в 1820 г. русская экспедиция Беллинсгаузена и Лазарева открыла Антарктиду."],
    ["Почему наибольшее число исследовательских экспедиций в XVIII — начале XIX в. отправляли именно Англия и Франция?","Англия и Франция были главными колониальными соперницами и нуждались в новых территориях и торговых путях. Они имели сильные флоты и финансовые средства для снаряжения экспедиций. Научные общества и академии лоббировали отправку учёных в путешествия."]
  ]},

    ["Кто был султаном Османской империи в 1789–1807 гг.?","Селим III","Ахмед III","Махмуд I","Абдул-Хамид I",0],
    ["Что такое Восточный вопрос?","Комплекс международных проблем, связанных с ослаблением Османской империи","Война на Востоке","Торговый путь","Религиозный спор",0]
  ], a:[
    ["Какие реформы пытались проводить турецкие султаны в XVIII — начале XIX в.?","Ахмед III (Эпоха тюльпанов) — первые реформы по европейскому образцу. Махмуд I — модернизация артиллерии с помощью европейских специалистов. Селим III («Обновлённый порядок») — реформа армии, флота, налогов, создание инженерного училища."],
    ["Какие силы и почему противились проведению реформ в Османской империи?","Янычары боялись потерять привилегии и выступили против повышения дисциплины и создания новых войск. Улемы сопротивлялись изменениям в религии и образовании. Провинциальные правители не хотели терять самостоятельность."],
    ["Что такое Восточный вопрос?","Комплекс международных проблем, связанных с ослаблением Османской империи и борьбой европейских держав за влияние на Ближнем Востоке. Включал вопросы о судьбе христианских народов, о проливах, о территориях. Возник во второй половине XVIII в. и оставался острым до начала XX в."]

  {t:"§26. Индия: утрата независимости", q:[
    ["Когда произошла битва при Плесси?","1757","1765","1739","1799",0],
    ["Кто командовал английскими войсками при Плесси?","Роберт Клайв","Мир Джафар","Хейдар Али","Типу Султан",0],

    ["Рассмотрите иллюстрацию в начале параграфа. Кого из двух военачальников художник представляет как главное действующее лицо?","Роберт Клайв изображён на коне, в окружении свиты, он приветствует Мир Джафара. Мир Джафар стоит ниже, с поклоном. Художник подчёркивает главенство англичанина, а индийский правитель представлен как подчинённый."],
    ["К каким последствиям привело ослабление власти Великих Моголов?","Империя распалась на самостоятельные княжества, которые враждовали друг с другом. Афганцы и Надир-шах разоряли Дели и северные земли. Это облегчило англичанам покорение Индии."],
    ["Какие этапы можно выделить в истории покорения англичанами Индии?","1) Торговля и фактории; 2) Битва при Плесси (1757) — установление контроля над Бенгалией; 3) Получение права сбора налогов (1765); 4) Войны с Майсуром и другими княжествами; 5) К концу XVIII в. значительная часть Индии под властью Ост-Индской компании."],
    ["Почему ни одно из индийских государств XVIII в. не смогло объединить под своей властью Индию, как это в своё время сделали Великие Моголы?","Княжества враждовали между собой, не было единства даже внутри конфедерации маратхов. Правители преследовали личные интересы и не осознавали общую угрозу. Англичане умело использовали эти противоречия, разжигая рознь."],
    ["Как было организовано управление английскими владениями в Индии?","Всеми владениями управлял Совет Ост-Индской компании, которому подчинялся генерал-губернатор. На низших административных должностях и в качестве советников использовались индийцы. Княжества, связанные договорами с компанией, лишались права вести самостоятельную внешнюю политику и содержать армию."]
  ]},
  {t:"§27. Китай и Япония: закрываясь от Запада", q:[
    ["Кто был императором Китая в 1661–1722 гг.?","Канси","Юнчжэн","Цяньлун","Шуньчжи",0],
    ["Когда Китай «закрылся» от Запада?","1757","1724","1639","1793",0],
    ["Когда Япония «закрылась» от Запада?","1639","1757","1724","1800",0]

    ["Как вы думаете, с чем было связано то повышенное внимание, которое императоры династии Цин уделяли изданию именно классической китайской литературы?","Стремление показать, что маньчжуры — не «варвары», а продолжатели китайской культурной традиции. Классическая литература укрепляла конфуцианские ценности, которые были основой империи. Это также позволяло контролировать содержание книг через цензуру."],
    ["Как бы вы оценили налоговую политику императора Канси, исходя из её ближайших и отдалённых последствий?","Ближайшие последствия: экономический подъём, рост населения, восстановление хозяйства. Отдалённые: слишком быстрый рост населения создал дефицит пахотных земель и привёл к обеднению крестьян. В итоге это стало одной из причин кризиса империи."],
    ["Как вы думаете, почему Россия сохранила нейтралитет во время конфликта между Китаем и Джунгарским ханством?","Россия не была заинтересована в усилении ни Китая, ни Джунгарии. Кроме того, Россия вела свои войны (Северную, с Турцией) и не могла отвлекать силы на восток. Нейтралитет позволял сохранять торговлю с обеими сторонами."],
    ["Почему императоры династии Цин в этот период придавали такое значение ужесточению цензуры?","Цензура должна была скрыть недовольство маньчжурским правлением и укрепить власть династии. Она также служила для контроля над умами и предотвращения заговоров. Уничтожение «подозрительных» книг было частью политики консервации существующего порядка."],
    ["Какими общими мотивами руководствовались правители Китая и Японии, принимая решение о «закрытии» своих стран?","Стремление сохранить самобытность и традиционный уклад от внешнего влияния. Опасение, что европейцы (миссионеры, торговцы) подорвут власть и религиозные основы. Желание законсервировать существующие порядки."]

    ["Когда произошла Война за независимость испанских колоний?","1810–1826","1790–1800","1800–1810","1820–1830",0],
    ["Кто был лидером освободительного движения в Венесуэле?","Симон Боливар","Франсиско де Миранда","Хосе де Сан-Мартин","Мигель Идальго",0],
    ["Когда была провозглашена независимость Бразилии?","1822","1810","1804","1826",0]
  ], a:[
    ["Каковы причины Войны за независимость в Латинской Америке?","Реформы просвещённого абсолютизма в Испании усилили налоговый гнёт и конкуренцию для креолов. Запрет торговли с другими странами мешал сбыту продукции. Примеры США и Гаити вдохновляли на борьбу. Недовольство росло во всех слоях общества."],
    ["Назовите черты, характерные для внутриполитического развития бывших колоний в Латинской Америке.","Политическая нестабильность, частые перевороты и мятежи. Каудильизм — власть сильных лидеров, опирающихся на личную преданность. Конституции мало учитывали интересы большинства, сохранялось рабство и имущественный ценз."],
    ["С. Боливар носит почётное прозвище Освободитель. Выясните, какого деятеля и почему называют Предтечей.","Предтечей называют Франсиско де Миранду. Он первым начал борьбу за независимость Латинской Америки, участвовал в Войне за независимость США и Французской революции. Его идеи и деятельность подготовили освободительное движение."]
  ]},
  {t:"§29. Африка во времена расцвета работорговли", q:[
    ["Когда был запрещён работорговля в Великобритании?","1807","1789","1794","1815",0],
    ["Что такое аболиционизм?","Движение за отмену рабства и работорговли","Движение за колонизацию","Религиозное движение","Военная реформа",0],
    ["Когда была основана Капская колония?","1652","1672","1700","1795",0]
  ], a:[
    ["Рассмотрите иллюстрацию в начале параграфа. Какую роль в работорговле играли вожди и знать народов Африки?","Вожди и знать продавали рабов европейцам в обмен на оружие, безделушки, металлы, ткани, спиртные напитки. Они обогащались за счёт торговли «живым товаром». Это способствовало усилению их власти и войн между племенами."],
    ["Что изменилось в работорговле с приходом европейцев?","Масштабы работорговли резко возросли, она стала массовой и ориентированной на вывоз в Америку. Рабы превратились в главный товар «треугольной торговли». Африка потеряла миллионы людей."],
    ["Выскажите предположение, почему такая гравюра могла появиться именно во французском издании, причём именно в последние годы XVIII в.","К концу XVIII в. во Франции усилилось движение аболиционистов, и гравюра могла быть частью антиработорговой пропаганды. Она показывает жестокость работорговли и роль африканских вождей в ней. Это соответствовало духу Просвещения и осуждению рабства."],
    ["В какую систему атлантической торговли была включена африканская работорговля в XVII—XVIII вв.?","В систему «треугольной торговли»: из Европы в Африку везли товары, оттуда — рабов в Америку, а из Америки — колониальные товары в Европу."],
    ["Почему остров Горе в Сенегале был включён в список объектов Всемирного наследия ЮНЕСКО?","Остров Горе был одним из крупнейших центров работорговли на западном побережье Африки. На нём сохранились дома работорговцев и помещения для содержания рабов. Он включён в список ЮНЕСКО как памятник, напоминающий о трагедии работорговли и её последствиях."],
    ["Почему даже после запрета работорговли её масштабы фактически остались прежними?","Контрабандная торговля приносила огромные доходы, и запреты легко обходились. Влиятельные силы (купцы, судовладельцы, плантаторы) были заинтересованы в продолжении работорговли. Английская блокада побережья Африки оказалась неэффективной."]

function applyTheme(theme){ document.body.className = ''; if(theme && theme !== 'default') document.body.classList.add('theme-' + theme); }

function sh(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function prep(q){let o=[q[1],q[2],q[3],q[4]],c=q[5],i=[0,1,2,3];for(let k=i.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[i[k],i[j]]=[i[j],i[k]]}let no=i.map(x=>o[x]);return[q[0],no[0],no[1],no[2],no[3],i.indexOf(c)]}

function startTest(t,p){
  lastWasExam = false; curTitle=t; currentPool=p;
  curQs = sh(p).slice(0,7).map(prep);

  document.getElementById('book-screen').style.display='none';

  document.getElementById('ttl').textContent=t;
  document.getElementById('rb').style.display='none';
  const c=document.getElementById('qc'); c.innerHTML='';
  curQs.forEach((q,i)=>{
    const qd=document.createElement('div'); qd.className='qc';
    const h = (userStats.purchased.hint || 0) > 0 ? `<button class="hint-btn" onclick="useHint(this)">💡</button>` : '';
    qd.innerHTML = `${h}<div class="qt">${i+1}. ${q[0]}</div>`;
    const o=document.createElement('div'); o.className='ol';
    for(let j=1;j<=4;j++){
      const b=document.createElement('button'); b.className='ob'; b.textContent=q[j];
      b.onclick=()=>handleAnswer(qd,q,j-1,b);
      o.appendChild(b);
    }
    qd.appendChild(o); c.appendChild(qd);
  });

function useHint(btn){
  if(!userStats.purchased.hint || userStats.purchased.hint <= 0) return;
  userStats.purchased.hint--;
  saveStats();
  updatePesoUI();

  const qd = btn.closest('.qc');
  const idx = Array.from(document.querySelectorAll('.qc')).indexOf(qd);
  const correctIdx = curQs[idx][5];
  const btns = qd.querySelectorAll('.ob');
  let n = 0;
  for (let i = 0; i < 4; i++) {
    if (i !== correctIdx && n < 2) { btns[i].classList.add('disabled'); btns[i].style.opacity = '0.2'; n++; }
  }
  btn.style.display = 'none';
}

function handleAnswer(qd,q,si,sb){
  if(qd.dataset.ans==='true') return;
  qd.dataset.ans='true';
  const c=q[5], bs=qd.querySelectorAll('.ob');
  bs.forEach(b=>b.classList.add('disabled'));
  bs[c].classList.add('correct');
  if(si===c) score++; else sb.classList.add('wrong');
  ansCount++;
  if(ansCount===curQs.length) showResult();
}

function startFlashcards(){

  let pool=[]; data.forEach(ch=>ch.p.forEach(p=>p.q.forEach(q=>{ pool.push({front:q[0],back:q[q[5]+1]}); })));
  pool = sh(pool);
  let idx = 0;
  const area = document.getElementById('game-area');
  function render(){
    if(idx >= pool.length) idx = 0;
    if(idx < 0) idx = pool.length - 1;
    const card = pool[idx];
    area.innerHTML = `
      <div class="widget">
        <div class="widget-title">Карточка ${idx+1} из ${pool.length}</div>
        <div class="flashcard" onclick="this.classList.toggle('flipped')">
          <div class="fc-inner">
            <div class="fc-front">${card.front}</div>
            <div class="fc-back">${card.back}</div>
          </div>
        </div>
        <p style="font-size:12px;color:#7f8c8d;margin-bottom:12px;">Нажмите на карточку, чтобы перевернуть</p>
        <div style="display:flex;gap:10px;">
          <button class="bc" onclick="window._fcPrev()" style="background:var(--border);color:var(--text);">←</button>

        <button class="bc" style="margin-top:10px;background:var(--border);color:var(--text);" onclick="renderDashboard()">В меню</button>
      </div>`;
  }
  window._fcPrev = ()=>{ idx--; render(); };
  window._fcNext = ()=>{ idx++; render(); };
  render();
  window.scrollTo({top: area.offsetTop - 60, behavior:'smooth'});
}

  area.innerHTML = `
    <div class="widget" id="tf-area">
      <div class="widget-title">Утверждение ${tfRound.current+1} из ${tfRound.questions.length}</div>
      <div style="font-size:16px;margin:20px 0;font-weight:600;line-height:1.6;color:var(--text);">«${q.text}»</div>
      <div style="display:flex;">
        <button class="tf-btn tf-true" onclick="handleTFAnswer(true,${q.isTrue},this)">Верно</button>
        <button class="tf-btn tf-false" onclick="handleTFAnswer(false,${q.isTrue},this)">Неверно</button>
      </div>
    </div>`;
  window.scrollTo({top: area.offsetTop - 60, behavior:'smooth'});
}
function handleTFAnswer(userChoice, isActuallyTrue, btnElement){
  if(!tfRound.active) return;
  tfRound.active = false;
  document.querySelectorAll('.tf-btn').forEach(b=>b.disabled=true);
  if(userChoice === isActuallyTrue){ btnElement.classList.add('correct'); tfRound.score++; }
  else {
    btnElement.classList.add('wrong');
    document.querySelector(isActuallyTrue ? '.tf-true' : '.tf-false').classList.add('correct');
  }
  setTimeout(()=>{ tfRound.current++; tfRound.active=true; showNextTF(); }, 1500);
}
function showTFResult(){
  const area = document.getElementById('game-area');
  const earned = Math.floor(tfRound.score*1.5);
  userStats.pesos += earned;
  updateStreak();
  saveStats();
  area.innerHTML = `
    <div class="widget">
      <div class="widget-title">Раунд завершён!</div>
      <div style="font-size:24px;margin:15px 0;color:var(--primary);font-weight:bold;">${tfRound.score} из ${tfRound.questions.length}</div>
      <div style="margin-bottom:15px;">Заработано: ${earned} Песо</div>
      <button class="bc" onclick="startTrueFalse()">Играть ещё</button>
      <button class="bc" onclick="renderDashboard()" style="margin-top:10px;background:var(--border);color:var(--text);">В меню</button>
    </div>`;
}

function updateStreak(){
  const today = new Date().toDateString();
  if(userStats.lastDate !== today){
    userStats.streak++;
    userStats.lastDate = today;
    saveStats();
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  if(currentUserCode){
    await loadProgress();
    document.getElementById('lock-screen').style.display='none';
    document.getElementById('peso-balance').style.display='flex';
  }
});
document.getElementById('access-code').addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkAccess();
});
</script>
