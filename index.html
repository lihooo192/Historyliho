<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History by liho | 8 класс</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2980b9">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f1ea;--text:#2c3e50;--primary:#2980b9;--card:#fff;--border:#e0dcd3;--gb:#e8f8f5;--gbr:#1abc9c;--gt:#117864;--red:#e74c3c;--gold:#f1c40f}
body.theme-dark{--bg:#121212;--text:#e0e0e0;--card:#1e1e1e;--border:#333;--primary:#3498db}
body.theme-parchment{--bg:#f4e4bc;--text:#3e2723;--card:#fdf5e6;--border:#d7ccc8;--primary:#8d6e63}
body.theme-archive{--bg:#2b2b2b;--text:#d4d4d4;--card:#383838;--border:#555;--primary:#e67e22}
body.theme-forest{--bg:#e8f5e9;--text:#1b5e20;--card:#ffffff;--border:#c8e6c9;--primary:#2e7d32}
body.theme-ocean{--bg:#e0f2f1;--text:#004d40;--card:#ffffff;--border:#b2dfdb;--primary:#00796b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:20px 10px;transition:background .3s,color .3s}
.container{max-width:900px;margin:0 auto;position:relative}
#peso-balance{position:absolute;top:-10px;left:0;background:var(--card);padding:5px 15px;border-radius:20px;border:2px solid var(--gold);font-weight:700;font-size:15px;z-index:100;display:flex;align-items:center;gap:15px}
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:40px;padding-bottom:40px}
.main-title{font-family:'Merriweather',serif;font-size:52px;font-weight:900;background:linear-gradient(45deg,#1e3a5f,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}
.top-actions{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--card);border:1px solid var(--border);padding:8px 14px;border-radius:20px;font-weight:600;cursor:pointer;font-size:13px;color:var(--text)}
.chip:hover{border-color:var(--primary);color:var(--primary)}
#install-btn{display:none}
.books{display:flex;gap:20px;width:100%;max-width:800px;justify-content:center}
.book{flex:1;background:var(--card);border:2px solid var(--border);border-radius:16px;padding:20px 15px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;transition:.2s}
.book:hover{transform:translateY(-5px);border-color:var(--primary)}
.book-cover{width:100%;max-width:220px;height:300px;object-fit:cover;border-radius:8px;margin-bottom:15px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.bt{font-family:'Merriweather',serif;font-size:20px;font-weight:700;margin-bottom:8px}
.bd{font-size:13px;color:#7f8c8d}
@media(max-width:600px){.main-title{font-size:32px}.books{gap:10px}.book{padding:15px 8px}.bt{font-size:14px}.bd{font-size:10px}.book-cover{height:200px}}
#daily-block{width:100%;max-width:800px;margin-bottom:24px;display:none}
.daily-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.daily-grid{grid-template-columns:1fr 1fr}}
.daily-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;font-size:13px}
.daily-card .di{font-size:26px;margin-bottom:4px}
.daily-card .dt{font-weight:700;font-size:13px;margin-bottom:4px}
.daily-card .dd{color:#7f8c8d;font-size:11px;margin-bottom:8px;line-height:1.3}
.daily-card button{background:var(--gold);border:none;padding:6px 10px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;width:100%}
.daily-card button.done{background:var(--gbr);color:#fff;cursor:default}
.daily-card button[disabled]{opacity:.6;cursor:default}
.daily-card .progress{background:var(--bg);border-radius:6px;height:6px;overflow:hidden;margin-bottom:6px}
.daily-card .progress div{background:var(--gbr);height:100%;transition:width .3s}
#book-screen{display:none;padding-top:40px}
.header{text-align:center;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-family:'Merriweather',serif;font-size:22px;font-weight:700}
.btn-nav{background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:8px;font-weight:500;cursor:pointer;color:var(--text);font-size:14px}
.tabs{display:flex;margin-bottom:20px;border-bottom:2px solid var(--border);overflow-x:auto}
.tab{flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;background:none;border:none;color:#7f8c8d;border-bottom:3px solid transparent;font-size:15px;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.cb{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:20px}
.cn{font-family:'Merriweather',serif;font-size:16px;font-weight:700;margin-bottom:15px}
.cn::before{content:'📖 '}
.bg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px}
@media(max-width:400px){.bg{grid-template-columns:repeat(4,1fr)}}
.bp{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 5px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;color:var(--text)}
.bp:hover{background:var(--card);border-color:var(--primary);color:var(--primary)}
.bc{width:100%;background:linear-gradient(135deg,var(--primary),#3498db);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
.para-header{font-family:'Merriweather',serif;font-size:16px;font-weight:700;margin:20px 0 8px 0;border-bottom:1px solid var(--border);padding-bottom:5px}
.pa{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:var(--card)}
.pa summary{background:var(--bg);padding:12px 18px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.pa summary::after{content:'▼';font-size:10px;color:#7f8c8d}
.qi{padding:15px}
.qa{margin-bottom:12px;border-bottom:1px dashed var(--border);padding-bottom:12px}
.qa summary{padding:6px 0;font-size:14px;font-weight:500;cursor:pointer;list-style:none;display:flex;gap:10px;line-height:1.4}
.qa summary::before{content:'?';display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--border);border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
.at{margin-top:8px;margin-left:30px;padding:14px;background:var(--gb);border-left:3px solid var(--gbr);border-radius:0 8px 8px 0;color:var(--gt);font-size:14px}
#test{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.th{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid var(--border)}
@media(min-width:600px){.th{flex-direction:row;justify-content:space-between;align-items:center}}
.tt{font-family:'Merriweather',serif;font-size:18px;font-weight:700}
.qc{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:15px;position:relative}
.qt{font-size:15px;font-weight:600;margin-bottom:12px;padding-right:42px}
.ol{display:flex;flex-direction:column;gap:8px}
.ob{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:left;font-size:14px;cursor:pointer;color:var(--text)}
.ob:hover{background:var(--bg)}
.ob.correct{background:var(--gb);border-color:var(--gbr);color:var(--gt);font-weight:600}
.ob.wrong{background:#fdedec;border-color:var(--red);color:#922b21;text-decoration:line-through}
.ob.disabled{pointer-events:none;opacity:.7}
.rb{display:none;background:var(--bg);border:1px solid var(--primary);border-radius:12px;padding:25px 15px;text-align:center;margin-top:20px}
.rs{font-size:36px;font-weight:700;color:var(--primary);margin:10px 0;font-family:'Merriweather',serif}
.dashboard-header{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.exam-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:600px){.exam-grid{grid-template-columns:1fr}}
.widget{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.widget-icon{font-size:32px;margin-bottom:10px}
.widget-title{font-weight:700;font-size:16px;margin-bottom:10px}
.widget-desc{font-size:13px;color:#7f8c8d;margin-bottom:15px;flex-grow:1}
.flashcard{perspective:1000px;width:100%;height:220px;cursor:pointer;margin-bottom:15px}
.fc-inner{position:relative;width:100%;height:100%;text-align:center;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:12px;font-size:16px;font-weight:600;text-align:center;line-height:1.4}
.fc-front{background:var(--card);border:2px solid var(--primary);color:var(--primary)}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg)}
#tf-area{text-align:center}
.tf-btn{flex:1;padding:15px;font-size:18px;font-weight:700;border:none;border-radius:8px;cursor:pointer;color:white;margin:0 5px}
.tf-true{background:#2ecc71}.tf-false{background:var(--red)}
.tf-btn:disabled{opacity:.6;cursor:not-allowed}
.tf-btn.correct{box-shadow:0 0 0 4px var(--gbr)}
.tf-btn.wrong{box-shadow:0 0 0 4px var(--red);opacity:.8}
.shop-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:10px;border-radius:8px;margin-bottom:10px;border:1px solid var(--border);gap:10px}
.shop-item button{width:auto;padding:6px 12px;font-size:14px}
.admin-panel{background:#fff3cd;border:1px solid #ffeeba;padding:15px;border-radius:12px;margin-bottom:20px;color:#856404}
.admin-panel button{background:#ffc107;color:#000;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px;width:100%}
.hint-btn{position:absolute;top:15px;right:15px;background:var(--gold);border:none;border-radius:50%;width:35px;height:35px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.2);z-index:5}
#lock-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.lock-card{background:var(--card);padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);max-width:400px;width:100%}
#access-code{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:16px;margin-bottom:15px;text-transform:uppercase;text-align:center;font-weight:bold;background:var(--bg);color:var(--text)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--card);border:2px solid var(--gbr);padding:14px 20px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:10000;transition:transform .3s;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#achievements-modal,#stats-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9998;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#achievements-modal.open,#stats-modal.open{display:flex}
.ach-card,.stats-card{background:var(--card);border-radius:16px;padding:20px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:15px}
.ach-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;font-size:11px;opacity:.4}
.ach-item.got{opacity:1;border-color:var(--gbr);background:var(--gb)}
.ach-item .ai{font-size:26px;margin-bottom:4px}
.ach-item .an{font-weight:700;margin-bottom:2px}
.ach-item .ad{color:#7f8c8d;font-size:10px;line-height:1.3}
.stats-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.stats-table th,.stats-table td{padding:8px;border-bottom:1px solid var(--border);text-align:left}
.stats-table th{background:var(--bg);position:sticky;top:0}
.stats-table th:hover{cursor:pointer;color:var(--primary)}
.offline-banner{display:none;background:#fff3cd;color:#856404;padding:8px;text-align:center;font-weight:600;border-radius:8px;margin-bottom:15px}
body.offline .offline-banner{display:block}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:10px}
.review-q{font-weight:600;margin-bottom:8px}
.review-ans{color:var(--red);text-decoration:line-through;font-size:14px}
.review-correct{color:var(--gt);font-weight:600;font-size:14px;margin-top:4px}
.review-exp{font-size:13px;color:#7f8c8d;margin-top:6px;font-style:italic}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div style="font-size:48px;margin-bottom:15px;">🔒</div>
    <h2 style="font-family:'Merriweather',serif;margin-bottom:10px;">Доступ ограничен</h2>
    <p style="color:#7f8c8d;font-size:14px;margin-bottom:20px;">Введите код доступа.</p>
    <input type="text" id="access-code" placeholder="Например: HIST-K7M2X9">
    <button onclick="checkAccess()" class="bc">Войти</button>
    <div id="lock-error" style="color:var(--red);font-size:14px;margin-top:10px;display:none;"></div>
  </div>
</div>

<div id="toast"></div>

<div class="container">
  <div id="peso-balance" style="display:none;">
    <span>🪙 <span id="peso-amount">0</span></span>
    <span>💡 <span id="hint-amount">0</span></span>
  </div>
  
  <div id="home">
    <div class="main-title">History by liho</div>
    <div class="offline-banner">📡 Офлайн-режим — прогресс сохранится локально</div>
    <div class="top-actions">
      <button class="chip" onclick="openAchievements()">🏆 Достижения</button>
      <button class="chip" onclick="openThemes()">🎨 Темы</button>
      <button class="chip" id="install-btn" onclick="installPWA()">📲 Установить</button>
    </div>
    
    <div id="daily-block"></div>
    
    <div class="books">
      <div class="book" onclick="openBook('world')">
        <img src="world.jpeg" alt="Всеобщая" class="book-cover" onerror="this.style.display='none'; this.parentElement.innerHTML += '<div class=\'book-cover\' style=\'display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#2980b9,#3498db);color:white;\'>🌍</div>';">
        <div class="bt">Всеобщая история</div><div class="bd">XVIII — начало XIX в.</div>
      </div>
      <div class="book" onclick="openBook('russia')">
        <img src="russia.jpeg" alt="Россия" class="book-cover" onerror="this.style.display='none'; this.parentElement.innerHTML += '<div class=\'book-cover\' style=\'display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:white;\'>🏛️</div>';">
        <div class="bt">История России</div><div class="bd">XVIII — начало XIX в.</div>
      </div>
    </div>
  </div>
  
  <div id="book-screen">
    <div class="header">
      <h1 id="book-title"></h1>
      <button class="btn-nav" onclick="goHome()">← На главную</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('tests')">Тесты</button>
      <button class="tab" onclick="switchTab('qa')">Вопросы</button>
      <button class="tab" onclick="switchTab('exam')">Проверка знаний</button>
    </div>
    <div id="tests-content"></div>
    <div id="qa-content" style="display:none;"></div>
    <div id="exam-content" style="display:none;"></div>
  </div>
  
  <div id="test">
    <div class="th"><div class="tt" id="ttl"></div><button class="btn-nav" onclick="goBack()">← Назад</button></div>
    <div id="qc"></div>
    <div class="rb" id="rb">
      <div style="font-weight:600;font-size:16px;">Результат:</div>
      <div class="rs" id="sd"></div>
      <div style="font-weight:600;font-size:14px;" id="pd"></div>
      <div style="font-weight:600;font-size:16px;margin-top:5px;" id="gd"></div>
      <div id="review-btn" style="margin-top:15px;"></div>
      <button class="bc" onclick="restartTest()" style="margin-top:15px;">🔄 Пройти ещё раз</button>
    </div>
  </div>
</div>

<div id="achievements-modal">
  <div class="ach-card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font-family:'Merriweather',serif;">🏆 Достижения</h2>
      <button class="btn-nav" onclick="closeAchievements()">✕</button>
    </div>
    <div class="ach-grid" id="ach-grid"></div>
  </div>
</div>

<div id="stats-modal">
  <div class="stats-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
      <h2 style="font-family:'Merriweather',serif;">📊 Статистика</h2>
      <button class="btn-nav" onclick="document.getElementById('stats-modal').classList.remove('open')">✕</button>
    </div>
    <div style="margin-bottom:10px;">
      <button class="chip" onclick="loadClassStats()">🔄 Обновить</button>
      <button class="chip" onclick="exportCSV()">📥 Скачать CSV</button>
      <label style="font-size:13px;margin-left:10px;"><input type="checkbox" id="only-inactive" onchange="renderStatsTable()"> Только 7+ дней</label>
    </div>
    <div id="stats-container" style="max-height:40vh;overflow-y:auto;"></div>
    <h3 style="margin-top:20px;font-family:'Merriweather',serif;">❌ Топ ошибок</h3>
    <div id="wrong-top" style="margin-top:10px;"></div>
  </div>
</div>

<script>
/* ============================================================
   ВСЕОБЩАЯ ИСТОРИЯ (Точно по учебнику: 3 главы, 23 условных §)
   ============================================================ */
const W = [
{c:"Глава I. Век перемен", p:[
  {t:"§1. Преображение Европы", q:[
    ["Что такое модернизация?","Переход от традиционного аграрного к индустриальному обществу","Религиозное движение","Возврат к феодализму","Военная реформа",0],
    ["Что называют «европейским чудом»?","Стремительный экономический рост Европы в XVIII в.","Открытие Америки","Создание ООН","Промышленный переворот",0],
    ["Что такое «треугольная торговля»?","Из Европы товары в Африку, рабы в Америку, колониальные товары в Европу","Торговля между тремя городами","Обмен товаров на золото","Ярмарочная торговля",0]
  ], a:[
    ["Какое влияние оказала Научная революция на экономическое развитие стран Европы?","Научная революция соединила науку с практикой и дала толчок изобретениям. Эти открытия находили применение в промышленности, мореплавании и военном деле. В итоге наука стала двигателем экономического роста."],
    ["Какие новые возможности открыла транспортная революция?","Улучшились дороги, появились платные шоссе и новые повозки. Расширилось строительство каналов. Это удешевило доставку тяжёлых грузов и оживило торговлю."],
    ["Какие факторы обусловили начало модернизации стран Европы?","Удачное географическое положение, политическая раздробленность и конкуренция государств, Реформация, Великие географические открытия, Научная революция и рост грамотности."],
    ["В чём состояло европейское разделение труда?","Страны специализировались на том, что у них получалось лучше. Восточная Европа поставляла зерно, Англия — ткани, Франция — предметы роскоши. Это усилило торговые связи."]
  ]},
  {t:"§2. Эпоха Просвещения", q:[
    ["Что такое Просвещение?","Идейное течение, основанное на разуме, свободе и веротерпимости","Религиозное движение","Реформа армии","Колониальная политика",0],
    ["Кто автор теории разделения властей?","Монтескьё","Вольтер","Руссо","Дидро",0],
    ["Кто написал «Об общественном договоре» (1762)?","Руссо","Монтескьё","Вольтер","Локк",0]
  ], a:[
    ["Что такое рационализм? В чём его достоинства, недостатки?","Рационализм — убеждение, что разум является главным источником знаний. Достоинство — способствовал развитию науки. Недостаток — просветители объявляли «предрассудками» всё, чего не могли объяснить сами."],
    ["Почему во время Французской революции идею о естественных правах человека назвали «оружием разрушителей»?","Теория естественных прав утверждала, что люди рождаются равными. Критики указывали, что произвольно составленный перечень таких прав позволяет обвинить любое правительство в их нарушении и потребовать его низвержения."],
    ["Сравните теорию разделения властей Дж. Локка и Монтескьё.","Локк предлагал три ветви: законодательную, исполнительную и федеративную. Монтескьё предложил триаду: законодательную, исполнительную и судебную. Общее — идея разделения властей."],
    ["С чем связано двойственное отношение Вольтера к церкви и религии?","Вольтер критиковал католическую церковь и выступал за веротерпимость. При этом считал, что простому народу религия необходима как нравственная опора."],
    ["Какие виды интеллектуальных клубов существовали в Европе в XVIII в.?","Читательские клубы, академии, литературные салоны и кафе. В них обсуждали новости науки, литературы и политики."]
  ]},
  {t:"§3. Общество Старого порядка", q:[
    ["Что такое нация?","Историческая общность людей с общим языком, культурой и историей","Сословие","Религиозная группа","Армия",0],
    ["Что такое космополитизм?","Идеология, рассматривающая людей как граждан мира","Национализм","Патриотизм","Клерикализм",0],
    ["Кто написал брошюру «Что такое третье сословие?» (1789)?","Э. Ж. Сийес","Мирабо","Лафайет","Робеспьер",0]
  ], a:[
    ["Какие изменения происходили в положении дворянского сословия в течение XVIII в.?","Дворянство беднело из-за революции цен и утраты налоговых привилегий. Наиболее активные дворяне начинали заниматься предпринимательством. Часть дворян увлекалась идеями Просвещения."],
    ["Чем отличалась семья в XVIII в. от современной семьи?","Брак был социальным и экономическим союзом, основанным на расчёте. Создавались поздно, роли супругов были чётко распределены. Разводы были редкостью."],
    ["Какие причины приводили к увеличению числа бедняков в деревне и в городе в XVIII в.?","В деревне капиталистические преобразования разоряли часть крестьян. В городах рост населения и разорение ремесленников пополняли число безработных."],
    ["Как изменилось положение детей в XVIII в. по сравнению с ранним Новым временем?","Отказываются от тесного пеленания, детям выделяют отдельные комнаты, появляются детские книги. Ребёнка всё больше воспринимают как формируемую личность."],
    ["Найдите картины XVIII в., где показаны дети. Общее и различное.","Дети изображаются как самостоятельные персонажи. Общее — интерес к детству. Различное — в зависимости от сословия."]
  ]},
  {t:"§4. Государство Старого порядка", q:[
    ["Сколько республик было в Европе XVIII в.?","Четыре","Две","Одна","Восемь",0],
    ["Что такое просвещённый абсолютизм?","Политика реформ монархов, созвучная идеям Просвещения","Отмена монархии","Введение республики","Отделение церкви",0],
    ["Кто был королём Испании в 1759–1788 гг.?","Карл III","Карл II","Филипп V","Фердинанд VI",0]
  ], a:[
    ["Какой государственный строй давал наибольшие возможности для реформ?","Просвещённый абсолютизм, потому что власть монарха была достаточно сильной, чтобы преодолеть сопротивление привилегированных сословий."],
    ["Какие реформы просвещённого абсолютизма были созвучны идеям просветителей, а какие нет?","Созвучны: реформы образования, запрет пыток, веротерпимость. Не созвучны: укрепление централизации, усиление армии, сохранение абсолютизма."],
    ["Сходство и различие политики Карла III и Помбала?","Сходство: изгнание иезуитов, реформа образования. Различие в методах: Помбал действовал жёстко и деспотично, а реформы в Испании проводились осторожно."],
    ["К каким изменениям в образовании привело изгнание иезуитов?","Корона взяла университеты под покровительство, расширила преподавание естественных и точных наук. Образование стало светским."],
    ["Почему именем Помбала названа площадь в Лиссабоне, хотя он умер в опале?","Помбал восстановил Лиссабон после землетрясения, провёл реформы экономики и образования. Его преобразования надолго определили развитие Португалии."]
  ]},
  {t:"§5–6. В поисках европейского равновесия", q:[
    ["Что такое европейское равновесие?","Порядок, при котором ни одна из великих держав не имеет решающего преимущества","Союз всех монархий","Раздел Европы","Война всех против всех",0],
    ["Что такое пентархия?","Пять великих держав: Франция, Англия, Австрия, Пруссия, Россия","Пять республик","Пять религий","Пять империй",0],
    ["В какие годы шла Семилетняя война?","1756–1763","1700–1721","1775–1783","1805–1815",0]
  ], a:[
    ["Какие изменения произошли в системе международных отношений после Войны за испанское наследство и Северной войны?","Франция ослабла, Швеция утратила господство на Балтике. На смену гегемонии двух государств пришло европейское равновесие пяти великих держав."],
    ["Почему XVIII столетие называют «веком коалиций»?","Ни одна великая держава не решалась воевать в одиночку. Против усиливающегося противника создавались коалиции."],
    ["Почему было невозможно появление нового гегемона?","Пять великих держав уравновешивали друг друга и объединялись против того, кто пытался усилиться."],
    ["В чём особенности роли России в отношениях между великими державами?","Россия не имела непримиримых противоречий ни с одной из держав. Её вмешательство нередко решало исход противоборства."],
    ["Какие изменения произошли в способах ведения войны?","Войны стали менее ожесточёнными. Появилась идея короткой войны — быстрый манёвр и разгром в генеральном сражении. На смену наёмникам пришли профессиональные армии."],
    ["Почему Великобритания обладала самым большим флотом?","Колониальная политика требовала большого военного флота. Англия вкладывала в него огромные средства."],
    ["Чем определялся разный состав коалиций в Войне за австрийское наследство и в Семилетней войне?","Англия стремилась ослабить Францию в колониях, а Франция — не дать Пруссии усилиться."],
    ["Почему Семилетнюю войну называют «нулевой мировой»?","Боевые действия шли в Европе, Америке, Индии и на морях. В войне участвовали все великие державы."],
    ["Почему Великобритания выиграла у Франции борьбу за колонии?","Англия сосредоточилась на колониальной экспансии, а Франция распыляла силы. Английский флот был сильнее."]
  ]},
  {t:"§7. Успешные и безуспешные реформы французских королей", q:[
    ["Кто был королём Франции в 1715–1774 гг.?","Людовик XV","Людовик XIV","Людовик XVI","Карл X",0],
    ["Что такое французские парламенты?","Высшие суды, а не законодательные органы","Законодательные органы","Правительство","Армия",0],
    ["Кто провёл судебную реформу 1770–1774 гг.?","Канцлер Мопу","Тюрго","Людовик XV","Мирабо",0]
  ], a:[
    ["Перечислите факторы экономического роста Франции.","Расширение колониальной торговли, развитие промышленности и судостроения. Успехи сельского хозяйства. Рост населения до 30 млн."],
    ["Что представляли собой французские парламенты? Можно ли их отождествлять с английским?","Французские парламенты были высшими судами, а не законодательными органами. Отождествлять их с английским парламентом нельзя."],
    ["Чем собрание нотаблей отличалось от Генеральных штатов?","В Генеральные штаты депутатов избирали, а нотаблей приглашал король. Нотабли были малым подобием Генеральных штатов."],
    ["Можно ли правление Людовика XV и XVI назвать просвещённым абсолютизмом?","В целом нет: реформы проваливались из-за сопротивления привилегированных. Не было последовательности."],
    ["Почему удалась военная реформа, а налоговая нет?","Военная реформа не затрагивала интересы привилегированных сословий. Налоговая покушалась на привилегии дворянства и духовенства."],
    ["Что общего и в чём различие налоговых реформ Людовика XV и XVI?","Общее: обе пытались ввести всесословный налог, обе провалились. Различие: при Людовике XV налог был 5%, при Людовике XVI реформа была решительнее."]
  ]},
  {t:"§8–9. Германские земли и монархия Габсбургов", q:[
    ["Что такое «второе издание крепостничества»?","Усиление крепостного права в областях восточнее Эльбы","Отмена крепостного права","Реформа налогов","Создание армии",0],
    ["Кто был королём Пруссии в 1740–1786 гг.?","Фридрих II","Фридрих Вильгельм I","Фридрих I","Вильгельм I",0],
    ["Кто была Мария Терезия?","Эрцгерцогиня Австрии, императрица Священной Римской империи","Королева Франции","Королева Англии","Княгиня Пруссии",0]
  ], a:[
    ["Какие последствия — демографические, экономические и политические — оказала Тридцатилетняя война?","Демографические: огромные потери населения. Экономические: нехватка рабочих рук. Политические: закрепление раздробленности."],
    ["Почему Фридрих II не жалел денег на дворцы и искусства?","Дворцы и искусства были атрибутом великой державы. Он строил резиденции, учредил оперу и академию наук. Это соответствовало образу «философа на троне»."],
    ["Как Фридрих II повлиял на модернизацию Габсбургов?","Своими победами он показал военное превосходство Пруссии и вынудил Марию Терезию провести реформы."],
    ["Сравните реформы Марии Терезии и Иосифа II.","Реформы Марии Терезии были осторожными и дали прочные результаты. Реформы Иосифа II были глубже, но вызвали кризис."]
  ]},
  {t:"§10. Повседневная жизнь европейцев: старое и новое", q:[
    ["Что такое урбанизация?","Рост городов и повышение их роли в обществе","Строительство деревень","Перепись населения","Транспортная реформа",0],
    ["Какой город был самым большим в Европе в XVIII в.?","Лондон","Париж","Вена","Рим",0],
    ["Что такое комод?","Мебель с выдвижными ящиками для белья","Стол для письма","Шкаф для книг","Стул",0]
  ], a:[
    ["Что нового появилось в европейских городах?","Регулярная планировка, широкие улицы, таблички с названиями. Уличное освещение, мощение, вынос кладбищ. Появление полиции."],
    ["Что мешало сделать город более современным?","Отсутствие водопровода и канализации, скученность населения, недостаток средств. Эпидемии продолжались."],
    ["Выделите традиционные и новые продукты.","Традиционные: хлеб, каши, овощи, мясо, рыба. Новые: картофель, кукуруза, помидоры. Колониальные: сахар, кофе, чай."],
    ["Почему богатые европейцы начинают следить за модой?","Мода подчёркивала статус и отличие от низших сословий. Торговля дала доступ к новым тканям. Журналы распространяли парижские образцы."]
  ]},
  {t:"§11. Наука, образование, воспитание", q:[
    ["Кто создал классификацию растений и животных?","Карл Линней","Лаплас","Лавуазье","Эйлер",0],
    ["Кто открыл Уран в 1781 г.?","Уильям Гершель","Лаплас","Эйлер","Линней",0],
    ["Кто открыл кислород?","Лавуазье","Ломоносов","Бертолле","Эйлер",0]
  ], a:[
    ["Докажите связь науки и философии Просвещения.","Просветители опирались на достижения Научной революции. Научные открытия показывали, что мир познаваем разумом. Философия Просвещения пропагандировала науку."],
    ["Подготовьте презентацию об одном из экономистов XVIII в.","Адам Смит написал «Исследование о природе и причинах богатства народов». Он обосновал идею «невидимой руки» рынка."],
    ["Выделите новые черты в образовании XVIII в.","Государство берёт образование под контроль, делает его светским и централизованным. Появляются реальные школы."],
    ["Объясните связь изменения отношения к воспитанию и научной революции.","Научная революция показала, что мир познаваем. Возникла идея, что человека можно формировать через воспитание."]
  ]},
  {t:"§12–13. Культурное пространство Европы", q:[
    ["Какие стили существовали в искусстве XVIII в.?","Барокко, рококо, классицизм, сентиментализм","Только классицизм","Только барокко","Только рококо",0],
    ["Кто написал «Робинзона Крузо»?","Даниель Дефо","Джонатан Свифт","Гёте","Бомарше",0],
    ["Кто написал «Путешествия Гулливера»?","Джонатан Свифт","Даниель Дефо","Гёте","Бомарше",0]
  ], a:[
    ["Почему в эпоху Просвещения стал популярен классицизм?","Классицизм обращался к античным образцам, в которых просветители видели пример разумного устройства. Строгость линий соответствовала духу рациональности."],
    ["Какие направления существовали в литературе?","Просветительский роман, сентиментализм, готический роман, классицистическая драма."],
    ["Назовите выдающихся композиторов XVIII в.","Бах, Гендель, Вивальди, Гайдн, Моцарт. Их творчество соединило барочные традиции с новыми светскими формами."],
    ["Проследите связь «Робинзона Крузо» с протестантизмом.","Робинзон полагается на себя и на Бога. Труд, бережливость, вера в собственные силы — протестантские ценности."]
  ]}
]},
{c:"Глава II. Начало революционной эпохи", p:[
  {t:"§14. Великобритания: промышленная революция", q:[
    ["В какие годы произошла промышленная революция в Англии?","1760–1840-е","1700–1750","1800–1850","1750–1800",0],
    ["Кто изобрёл прялку «Дженни»?","Джеймс Харгривс","Джеймс Уатт","Ричард Аркрайт","Сэмюэл Кромптон",0],
    ["Кто создал универсальный паровой двигатель?","Джеймс Уатт","Томас Ньюкомен","Ричард Тревитик","Джордж Стефенсон",0]
  ], a:[
    ["Проанализируйте иллюстрацию. Как художник относился к промышленной революции?","Картина «Коалбрукдейл ночью» изображает огненное зарево над заводами. Это тревожный образ. Художник видит не только прогресс, но и разрушение."],
    ["Почему Англия, Шотландия и Уэльс слились в одно государство?","Объединяющим фактором была протестантская вера и общие традиции. Уния 1707 г. дала Шотландии доступ к рынкам."],
    ["Почему промышленная революция произошла именно в Англии?","Аграрная революция создала спрос. Рост населения дал рабочую силу. Запасы угля и железа обеспечили материалы. Капиталы накапливались в банках."],
    ["Для чего была нужна промышленная революция?","Рост спроса превысил возможности мануфактур. Машины позволили увеличить производство и снизить издержки."]
  ]},
  {t:"§15. Британские колонии против метрополии. Образование США", q:[
    ["Когда была принята Декларация независимости США?","4 июля 1776","1783","1787","1775",0],
    ["Кто был главнокомандующим армии колонистов?","Джордж Вашингтон","Томас Джефферсон","Бенджамин Франклин","Джон Адамс",0],
    ["Когда была принята Конституция США?","1787","1776","1789","1791",0]
  ], a:[
    ["Можно ли сказать, что принципы «Мэйфлауэра» воплотились в управлении колониями?","Да: в колониях действовали выборные собрания. Но права не распространялись на рабов, индейцев и неимущих."],
    ["Как проявлялось расовое неравенство?","Чернокожие рабы были бесправны. Индейцев вытесняли с земель. Сервенты после отработки становились свободными."],
    ["Почему Англия завоевала Индию, но потеряла Америку?","В Семилетней войне Англия захватила колонии Франции. Война истощила казну, и правительство обложило налогами американские колонии."],
    ["Почему вопрос о налогах оказался критическим?","Колонисты не имели представителей в парламенте. Они считали, что парламент не имеет права их облагать налогами."],
    ["Как США добились перелома?","Победа при Саратоге убедила Францию вступить в войну. Французский флот помог блокировать англичан при Йорктауне."],

let statsSort = { col: 'pesos', asc: false };
function sortStats(col) {
  if(statsSort.col === col) statsSort.asc = !statsSort.asc;
  else { statsSort.col = col; statsSort.asc = false; }
  renderStatsTable();
}

function renderStatsTable() {
  const cont = document.getElementById('stats-container');
  if(!classData.length) { cont.innerHTML = 'Нет данных'; return; }
  
  let filtered = [...classData];
  if(document.getElementById('only-inactive').checked) {
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    filtered = filtered.filter(u => !u.last_date || new Date(u.last_date) < weekAgo);
  }

  filtered.sort((a,b) => {
    let va = a[statsSort.col === 'tests' ? 'tests_passed' : statsSort.col === 'last' ? 'last_date' : statsSort.col] || 0;
    let vb = b[statsSort.col === 'tests' ? 'tests_passed' : statsSort.col === 'last' ? 'last_date' : statsSort.col] || 0;
    if(va < vb) return statsSort.asc ? -1 : 1;
    if(va > vb) return statsSort.asc ? 1 : -1;
    return 0;
  });

  let html = `<table class="stats-table"><thead><tr>
    <th onclick="sortStats('user_code')">Код</th>
    <th onclick="sortStats('pesos')">Песо</th>
    <th onclick="sortStats('streak')">Серия</th>
    <th onclick="sortStats('tests')">Тестов</th>
    <th onclick="sortStats('last')">Последний вход</th>
  </tr></thead><tbody>`;
  
  filtered.forEach(u => {
    html += `<tr>
      <td><b>${u.user_code}</b></td>
      <td>${u.pesos}</td>
      <td>${u.streak}</td>
      <td>${u.tests_passed}</td>
      <td>${u.last_date || '—'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  cont.innerHTML = html;
}

}

   МАГАЗИН И ТЕМЫ
   ============================================================ */
function openShop(){
  const area = document.getElementById('game-area'); if(!area) return;
  const items = [
    {id:'hint', name:'Подсказка 50/50', cost:30, desc:'Убирает два неверных варианта в текущем вопросе.'},
    {id:'theme-parchment', name:'Тема «Пергамент»', cost:100, desc:'Новая цветовая схема.'},
    {id:'theme-archive', name:'Тема «Тёмный архив»', cost:100, desc:'Тёмная тема в стиле архива.'},
    {id:'theme-forest', name:'Тема «Лесная»', cost:100, desc:'Спокойная зелёная гамма.'},
    {id:'theme-ocean', name:'Тема «Океан»', cost:100, desc:'Свежая бирюзовая гамма.'}
  ];
  let html = `<div class="widget" style="text-align:left;"><div class="widget-title" style="text-align:center;">🛒 Магазин</div>`;
  items.forEach(item=>{
    let owned = item.id !== 'hint' && userStats.currentTheme === item.id.replace('theme-','');
    let btnText = 'Купить';
    if(item.id === 'hint') btnText = `Купить (${item.cost}💰)`;
    else if(owned) btnText = 'Куплено';

    html += `<div class="shop-item">
      <div>
        <div style="font-weight:600;">${item.name}</div>
        <div style="font-size:12px;color:#7f8c8d;">${item.desc}</div>
        ${item.id === 'hint' ? `<div style="font-size:12px;color:var(--primary);margin-top:4px;">В наличии: ${userStats.purchased.hint || 0} шт.</div>` : ''}
      </div>
      <button class="bc" style="background:${owned?'var(--border)':'var(--gold)'};color:${owned?'#7f8c8d':'#000'};" onclick="buyItem('${item.id}',${item.cost})" ${owned?'disabled':''}>${btnText}</button>
    </div>`;
  });
  html += `<button class="bc" style="margin-top:10px;background:var(--border);color:var(--text);" onclick="renderDashboard()">← Назад</button></div>`;
  area.innerHTML = html;
  window.scrollTo({top: area.offsetTop - 60, behavior:'smooth'});
}

function openThemes() {
  const area = document.getElementById('game-area'); if(!area) return;
  const themes = [
    { id: 'default', name: 'Стандартная', cost: 0 },
    { id: 'parchment', name: 'Пергамент', cost: 100 },
    { id: 'archive', name: 'Тёмный архив', cost: 100 },
    { id: 'forest', name: 'Лесная', cost: 100 },
    { id: 'ocean', name: 'Океан', cost: 100 }
  ];
  let html = `<div class="widget" style="text-align:left;"><div class="widget-title" style="text-align:center;">🎨 Темы</div>`;
  themes.forEach(t => {
    let owned = userStats.currentTheme === t.id || userStats.purchased['theme-'+t.id] || t.id === 'default';
    let active = userStats.currentTheme === t.id;
    html += `<div class="shop-item">
      <div><div style="font-weight:600;">${t.name}</div></div>
      ${active ? '<span style="color:var(--gbr);font-weight:700;">Активна</span>' : (owned ? `<button class="bc" onclick="applyTheme('${t.id}'); userStats.currentTheme='${t.id}'; saveStats(); openThemes();">Применить</button>` : `<button class="bc" onclick="buyItem('theme-${t.id}', ${t.cost})" style="background:var(--gold);color:#000;">Купить (${t.cost}💰)</button>`)}
    </div>`;
  });
  html += `<button class="bc" style="margin-top:10px;background:var(--border);color:var(--text);" onclick="document.getElementById('game-area').innerHTML='';">← Закрыть</button></div>`;
  area.innerHTML = html;
  window.scrollTo({top: area.offsetTop - 60, behavior:'smooth'});
}

function buyItem(id, cost){
  if(userStats.pesos < cost){ alert('Недостаточно Песо!'); return; }
  userStats.pesos -= cost;
  if(id === 'hint') {
    userStats.purchased.hint = (userStats.purchased.hint || 0) + 1;
  }
  else if(id.startsWith('theme-')){ 
    const t = id.replace('theme-',''); 
    userStats.currentTheme = t; 
    userStats.purchased['theme-'+t] = true;
    applyTheme(t); 
  }
  saveStats(); updatePesoUI();
  alert('Покупка совершена!'); 
  openShop();
}

/* ============================================================
   ТЕСТЫ
   ============================================================ */
function startTest(t,p){
  lastWasExam = false; curTitle=t; currentPool=p;
  curQs = sh(p).slice(0,7).map(prep);
  ansCount=0; score=0; correctStreak=0;
  document.getElementById('book-screen').style.display='none';
  document.getElementById('test').style.display='block';
  document.getElementById('ttl').textContent=t;
  document.getElementById('rb').style.display='none';
  const c=document.getElementById('qc'); c.innerHTML='';
  curQs.forEach((q,i)=>{
    const qd=document.createElement('div'); qd.className='qc';
    const h = (userStats.purchased.hint || 0) > 0 ? `<button class="hint-btn" onclick="useHint(this)">💡</button>` : '';
    qd.innerHTML = `${h}<div class="qt">${i+1}. ${q[0]}</div>`;
    const o=document.createElement('div'); o.className='ol';
    for(let j=1;j<=4;j++){
      const b=document.createElement('button'); b.className='ob'; b.textContent=q[j];
      b.onclick=()=>handleAnswer(qd,q,j-1,b);
      o.appendChild(b);
    }
    qd.appendChild(o); c.appendChild(qd);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function useHint(btn){
  if(!userStats.purchased.hint || userStats.purchased.hint <= 0) return;
  userStats.purchased.hint--;
  saveStats();
  updatePesoUI();

  const qd = btn.closest('.qc');
  const idx = Array.from(document.querySelectorAll('.qc')).indexOf(qd);
  const correctIdx = curQs[idx][5];
  const btns = qd.querySelectorAll('.ob');
  let n = 0;
  for (let i = 0; i < 4; i++) {
    if (i !== correctIdx && n < 2) { btns[i].classList.add('disabled'); btns[i].style.opacity = '0.2'; n++; }
  }
  btn.style.display = 'none';
}

function handleAnswer(qd,q,si,sb){
  if(qd.dataset.ans==='true') return;
  qd.dataset.ans='true';
  const c=q[5], bs=qd.querySelectorAll('.ob');
  bs.forEach(b=>b.classList.add('disabled'));
  bs[c].classList.add('correct');
  
  if(si===c) {
    score++; 
    correctStreak++;
    if(correctStreak >= 10) checkAchievements();
  } else {
    sb.classList.add('wrong');
    correctStreak = 0;
    // Записываем ошибку
    if(!userStats.wrong_questions) userStats.wrong_questions = {};
    const qText = q[0];
    userStats.wrong_questions[qText] = (userStats.wrong_questions[qText] || 0) + 1;
  }
  trackDailyProgress('qa', 1);
  ansCount++;
  if(ansCount===curQs.length) showResult();
}

function showResult(){
  clearInterval(examTimer);
  updateStreak();
  const rb=document.getElementById('rb');
  rb.style.display='block';
  document.getElementById('sd').textContent = `${score} / ${curQs.length}`;
  const p = Math.round((score/curQs.length)*100);
  document.getElementById('pd').textContent = `Верных ответов: ${p}%`;
  let g='2';
  if(p>=85) g='5'; else if(p>=70) g='4'; else if(p>=50) g='3';
  document.getElementById('gd').textContent = `Оценка: ${g}`;
  
  if(p>=85) userStats.achievements.grade_5 = true;
  if(p===100) userStats.achievements.perfect = true;

  const earned = Math.floor(score*2);
  userStats.pesos += earned;
  if(p>=70 && !lastWasExam) {
    userStats.testsPassed++;
    trackDailyProgress('test', 1);
  }
  if(lastWasExam && p>=85) userStats.achievements.emperor = true;
  
  checkAchievements();
  saveStats();
  updatePesoUI();

  // Кнопка разбора ошибок
  const wrongQs = curQs.filter((q, idx) => {
    const qd = document.querySelectorAll('.qc')[idx];
    const btns = qd.querySelectorAll('.ob');
    const correctBtn = btns[q[5]];
    return !correctBtn.classList.contains('correct') || correctBtn.classList.contains('wrong'); // В упрощенном виде, лучше проверять по клику
  });
  
  // На самом деле проще запомнить ошибки в массив при клике. Но сделаем через DOM
  let wrongCount = 0;
  document.querySelectorAll('.qc').forEach((qd, idx) => {
    const btns = qd.querySelectorAll('.ob');
    const correctIdx = curQs[idx][5];
    // Если правильный ответ был выбран, кнопка получила класс correct при клике. 
    // Но если пользователь выбрал неправильный, кнопка wrong, а правильная correct.
    // Если пользователь выбрал правильный, кнопка correct.
    // Проверим, есть ли класс wrong.
    if (qd.querySelector('.ob.wrong')) {
      wrongCount++;
    }
  });

  const reviewBtn = document.getElementById('review-btn');
  if(wrongCount > 0) {
    reviewBtn.innerHTML = `<button class="bc" onclick="startReview()" style="background:var(--gold);color:#000;">🔍 Разобрать ошибки (${wrongCount})</button>`;
  } else {
    reviewBtn.innerHTML = `<div style="color:var(--gbr);font-weight:700;">✨ Идеально! Ошибок нет.</div>`;
  }

  rb.scrollIntoView({behavior:'smooth',block:'center'});
}

function startReview() {
  document.getElementById('rb').style.display = 'none';
  const c = document.getElementById('qc');
  c.innerHTML = '<h3 style="margin-bottom:15px;">Разбор ошибок</h3>';
  
  curQs.forEach((q, idx) => {
    const qd = document.querySelectorAll('.qc')[idx];
    if (qd && qd.querySelector('.ob.wrong')) {
      // Нашли вопрос с ошибкой
      const correctText = q[q[5]+1];
      let html = `<div class="review-item">
        <div class="review-q">${idx+1}. ${q[0]}</div>
        <div class="review-correct">✓ Правильный ответ: ${correctText}</div>
        <div class="review-exp">💡 Рекомендуем повторить эту тему в параграфе.</div>
      </div>`;
      c.innerHTML += html;
    }
  });
  c.innerHTML += `<button class="bc" onclick="goBack()" style="margin-top:20px;">← Вернуться к списку</button>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function restartTest(){
  if(lastWasExam) startExam();
  else startTest(curTitle, currentPool);
}

function startExam(){
  if(userStats.pesos < 30){ alert('Недостаточно Песо!'); return; }
  userStats.pesos -= 30; saveStats(); updatePesoUI();
  lastWasExam = true;
  const data = currentBook==='world' ? W : R;
  let pool=[]; data.forEach(ch=>ch.p.forEach(p=>pool=pool.concat(p.q)));
  curQs = sh(pool).slice(0,20).map(prep);
  curTitle = 'Экзамен'; currentPool = pool;
  ansCount=0; score=0; examTimeLeft=900; correctStreak=0;
  document.getElementById('book-screen').style.display='none';
  document.getElementById('test').style.display='block';
  document.getElementById('ttl').innerHTML = `Экзамен <span id="timer" style="color:var(--red);font-size:16px;margin-left:10px;">15:00</span>`;
  document.getElementById('rb').style.display='none';
  clearInterval(examTimer);
  examTimer = setInterval(()=>{
    examTimeLeft--;
    const m=Math.floor(examTimeLeft/60), s=examTimeLeft%60;
    const t=document.getElementById('timer');
    if(t) t.textContent = `${m}:${s<10?'0':''}${s}`;
    if(examTimeLeft<=0){ clearInterval(examTimer); showResult(); }
  },1000);
  const cont = document.getElementById('qc'); cont.innerHTML='';
  curQs.forEach((q,i)=>{
    const qd=document.createElement('div'); qd.className='qc';
    qd.innerHTML = `<div class="qt">${i+1}. ${q[0]}</div>`;
    const o=document.createElement('div'); o.className='ol';
    for(let j=1;j<=4;j++){
      const b=document.createElement('button'); b.className='ob'; b.textContent=q[j];
      b.onclick=()=>handleAnswer(qd,q,j-1,b);
      o.appendChild(b);
    }
    qd.appendChild(o); cont.appendChild(qd);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   ФЛЕШ-КАРТОЧКИ И ИГРЫ
   ============================================================ */
function startFlashcards(){
  const data = currentBook==='world' ? W : R;
  let pool=[]; data.forEach(ch=>ch.p.forEach(p=>p.q.forEach(q=>{ pool.push({front:q[0],back:q[q[5]+1]}); })));
  pool = sh(pool);
  let idx = 0;
  let cardsViewed = 0;
  const area = document.getElementById('game-area');
  function render(){
    if(idx >= pool.length) idx = 0;
    if(idx < 0) idx = pool.length - 1;
    const card = pool[idx];
    area.innerHTML = `
      <div class="widget">
        <div class="widget-title">Карточка ${idx+1} из ${pool.length}</div>
        <div class="flashcard" onclick="this.classList.toggle('flipped'); if(!this.dataset.counted){this.dataset.counted='1'; window._addCard();}">
          <div class="fc-inner">
            <div class="fc-front">${card.front}</div>
            <div class="fc-back">${card.back}</div>
          </div>
        </div>
        <p style="font-size:12px;color:#7f8c8d;margin-bottom:12px;">Нажмите на карточку, чтобы перевернуть</p>
        <div style="display:flex;gap:10px;">
          <button class="bc" onclick="window._fcPrev()" style="background:var(--border);color:var(--text);">←</button>
          <button class="bc" onclick="window._fcNext()">→</button>
        </div>
        <button class="bc" style="margin-top:10px;background:var(--border);color:var(--text);" onclick="renderDashboard()">В меню</button>
      </div>`;
  }
  window._addCard = () => {
    cardsViewed++;
    if(cardsViewed >= 50) { userStats.achievements.cards_50 = true; checkAchievements(); }
  };
  window._fcPrev = ()=>{ idx--; render(); };
  window._fcNext = ()=>{ idx++; render(); };
  render();
  window.scrollTo({top: area.offsetTop - 60, behavior:'smooth'});
}

function startTrueFalse(){
  const tfList = currentBook==='world' ? TF_DATA.world : TF_DATA.russia;
  tfRound.questions = sh(tfList).slice(0,5);
  tfRound.current=0; tfRound.score=0; tfRound.active=true;
  showNextTF();
}
function showNextTF(){
  if(tfRound.current >= tfRound.questions.length){ showTFResult(); return; }
  const area = document.getElementById('game-area');
  const q = tfRound.questions[tfRound.current];
  area.innerHTML = `
    <div class="widget" id="tf-area">
      <div class="widget-title">Утверждение ${tfRound.current+1} из ${tfRound.questions.length}</div>
      <div style="font-size:16px;margin:20px 0;font-weight:600;line-height:1.6;color:var(--text);">«${q.text}»</div>
      <div style="display:flex;">
        <button class="tf-btn tf-true" onclick="handleTFAnswer(true,${q.isTrue},this)">Верно</button>
        <button class="tf-btn tf-false" onclick="handleTFAnswer(false,${q.isTrue},this)">Неверно</button>
      </div>
    </div>`;
  window.scrollTo({top: area.offsetTop - 60, behavior:'smooth'});
}
function handleTFAnswer(userChoice, isActuallyTrue, btnElement){
  if(!tfRound.active) return;
  tfRound.active = false;
  document.querySelectorAll('.tf-btn').forEach(b=>b.disabled=true);
  if(userChoice === isActuallyTrue){ btnElement.classList.add('correct'); tfRound.score++; }
  else {
    btnElement.classList.add('wrong');
    document.querySelector(isActuallyTrue ? '.tf-true' : '.tf-false').classList.add('correct');
  }
  setTimeout(()=>{ tfRound.current++; tfRound.active=true; showNextTF(); }, 1500);
}
function showTFResult(){
  const area = document.getElementById('game-area');
  const earned = Math.floor(tfRound.score*1.5);
  userStats.pesos += earned;
  updateStreak();
  trackDailyProgress('tf', 1);
  userStats.tf_rounds = (userStats.tf_rounds || 0) + 1;
  if(userStats.tf_rounds >= 10) userStats.achievements.tf_10 = true;
  checkAchievements();
  saveStats();
  updatePesoUI();
  area.innerHTML = `
    <div class="widget">
      <div class="widget-title">Раунд завершён!</div>
      <div style="font-size:24px;margin:15px 0;color:var(--primary);font-weight:bold;">${tfRound.score} из ${tfRound.questions.length}</div>
      <div style="margin-bottom:15px;">Заработано: ${earned} Песо</div>
      <button class="bc" onclick="startTrueFalse()">Играть ещё</button>
      <button class="bc" onclick="renderDashboard()" style="margin-top:10px;background:var(--border);color:var(--text);">В меню</button>
    </div>`;
}

function updateStreak(){
  const today = new Date().toDateString();
  if(userStats.lastDate !== today){
    userStats.streak++;
    userStats.lastDate = today;
    saveStats();
  }
}

    await loadProgress();

    document.getElementById('peso-balance').style.display='flex';
  }
  
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  window.addEventListener('online', () => document.body.classList.remove('offline'));
  window.addEventListener('offline', () => document.body.classList.add('offline'));
  if (!navigator.onLine) document.body.classList.add('offline');
});

document.getElementById('access-code').addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkAccess();
});
